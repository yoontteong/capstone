<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>여행 메이트 모집</title>

    <style>

        * {
            box-sizing: border-box;
        }


        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f6f7f9;
        }


        .app {
            max-width: 500px;
            margin: 0 auto;

            min-height: 100vh;

            background: white;

            padding: 25px 20px 40px;
        }


        h1 {
            margin-top: 0;
            font-size: 25px;
        }


        .description {
            color: #777;
            font-size: 13px;
            margin-bottom: 25px;
        }


        label {
            display: block;

            font-weight: bold;

            margin: 18px 0 8px;
        }


        input,
        select,
        textarea {
            width: 100%;

            padding: 13px;

            border: 1px solid #ddd;

            border-radius: 12px;

            font-size: 14px;

            background: white;
        }


        textarea {
            height: 130px;
            resize: vertical;
        }


        .author-box {
            padding: 13px;

            border-radius: 12px;

            background: #f7f7f7;

            color: #555;

            font-size: 14px;
        }


        .dog-preview {
            display: none;

            margin-top: 12px;

            padding: 14px;

            background: #f3f8f3;

            border-radius: 13px;

            color: #555;

            font-size: 13px;

            line-height: 1.7;
        }


        .dog-preview-title {
            color: #2e7d32;

            font-weight: bold;

            margin-bottom: 5px;
        }


        .dog-preview-name {
            font-size: 15px;

            font-weight: bold;

            color: #222;
        }


        .dog-empty {
            padding: 16px;

            background: #f7f7f7;

            border-radius: 13px;

            color: #777;

            font-size: 13px;

            line-height: 1.6;

            text-align: center;
        }


        .dog-register-btn {
            display: block;

            margin-top: 10px;

            padding: 12px;

            border-radius: 12px;

            background: #4caf50;

            color: white;

            text-align: center;

            text-decoration: none;

            font-weight: bold;
        }


        .submit-btn {
            width: 100%;

            margin-top: 25px;

            padding: 14px;

            border: none;

            border-radius: 14px;

            background: #4caf50;

            color: white;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;
        }


        .submit-btn:hover {
            background: #43a047;
        }


        .back {
            display: block;

            text-align: center;

            margin-top: 18px;

            color: #666;

            text-decoration: none;
        }

    </style>
</head>


<body>


<div class="app">


    <h1>
        🐾 여행 메이트 모집
    </h1>


    <div class="description">
        제주에서 반려견과 함께할 여행 메이트를 찾아보세요.
    </div>


    {% if dogs %}


        <form method="POST">


            <!-- =========================
                 작성자
            ========================== -->

            <label>
                작성자
            </label>


            <div class="author-box">

                {{ session.get("nickname") or "사용자" }}

            </div>



            <!-- =========================
                 제목
            ========================== -->

            <label>
                제목
            </label>


            <input
                type="text"

                name="title"

                placeholder="예: 애월 같이 산책하실 분!"

                required
            >



            <!-- =========================
                 여행 날짜
            ========================== -->

            <label>
                여행 날짜
            </label>


            <input
                type="date"

                name="travel_date"

                required
            >



            <!-- =========================
                 지역
            ========================== -->

            <label>
                지역
            </label>


            <select
                name="region"
                required
            >

                <option value="">
                    지역을 선택해주세요
                </option>

                <option value="제주시">
                    제주시
                </option>

                <option value="애월">
                    애월
                </option>

                <option value="한림">
                    한림
                </option>

                <option value="조천">
                    조천
                </option>

                <option value="구좌">
                    구좌
                </option>

                <option value="성산">
                    성산
                </option>

                <option value="서귀포">
                    서귀포
                </option>

                <option value="중문">
                    중문
                </option>

            </select>



            <!-- =========================
                 반려견 선택
            ========================== -->

            <label>
                함께할 반려견
            </label>


            <select
                name="dog_id"

                id="dogSelect"

                required
            >

                <option value="">
                    반려견을 선택해주세요
                </option>


                {% for dog in dogs %}

                    <option
                        value="{{ dog.id }}"

                        data-name="{{ dog.name }}"

                        data-breed="{{ dog.breed or '' }}"

                        data-size="{{ dog.size_category }}"

                        data-personality="{{ dog.personality or '' }}"
                    >

                        🐶 {{ dog.name }}

                        {% if dog.breed %}
                            · {{ dog.breed }}
                        {% endif %}

                        · {{ dog.size_category }}

                        {% if dog.personality %}
                            · {{ dog.personality }}
                        {% endif %}

                    </option>

                {% endfor %}

            </select>



            <!-- 선택한 반려견 미리보기 -->

            <div
                class="dog-preview"

                id="dogPreview"
            >

                <div class="dog-preview-title">
                    선택한 반려견
                </div>


                <div
                    class="dog-preview-name"

                    id="dogPreviewName"
                ></div>


                <div
                    id="dogPreviewInfo"
                ></div>

            </div>



            <!-- =========================
                 모집 인원
            ========================== -->

            <label>
                총 모집 인원
            </label>


            <input
                type="number"

                name="max_people"

                value="2"

                min="2"

                max="10"

                required
            >



            <!-- =========================
                 내용
            ========================== -->

            <label>
                내용
            </label>


            <textarea
                name="content"

                placeholder="어떤 여행을 함께하고 싶은지 적어주세요."

                required
            ></textarea>



            <button
                type="submit"

                class="submit-btn"
            >
                모집글 등록
            </button>


        </form>



    {% else %}


        <div class="dog-empty">

            등록된 반려견이 없습니다.<br>

            여행 메이트를 모집하려면
            먼저 반려견을 등록해주세요.

        </div>


        <a
            href="/dog/register"

            class="dog-register-btn"
        >
            반려견 등록하기
        </a>


    {% endif %}



    <a
        href="/matches"

        class="back"
    >
        취소
    </a>


</div>



<script>

    const dogSelect =
        document.getElementById(
            "dogSelect"
        );


    if (dogSelect) {


        dogSelect.addEventListener(
            "change",
            function() {


                const option =
                    this.options[
                        this.selectedIndex
                    ];


                const preview =
                    document.getElementById(
                        "dogPreview"
                    );


                if (!this.value) {

                    preview.style.display =
                        "none";

                    return;

                }


                const name =
                    option.dataset.name || "";


                const breed =
                    option.dataset.breed || "";


                const size =
                    option.dataset.size || "";


                const personality =
                    option.dataset.personality || "";


                document.getElementById(
                    "dogPreviewName"
                ).textContent =
                    "🐶 " + name;


                const infos = [];


                if (breed) {
                    infos.push(
                        breed
                    );
                }


                if (size) {
                    infos.push(
                        size
                    );
                }


                if (personality) {
                    infos.push(
                        personality
                    );
                }


                document.getElementById(
                    "dogPreviewInfo"
                ).textContent =
                    infos.join(
                        " · "
                    );


                preview.style.display =
                    "block";

            }
        );

    }

</script>


</body>

</html>
