<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>장소 후기 작성 | PINKSOLE</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/bottomnav.css') }}">
  <style>
    :root{--primary:#49B9BF;--dark:#278D95;--light:#E7F7F7;--ink:#202B33;--muted:#7C8A93;--border:#E8EEF0}
    *{box-sizing:border-box} body{margin:0;background:#F3F6F7;color:var(--ink);font-family:'Pretendard','Noto Sans KR',Arial,sans-serif}
    .app{max-width:460px;min-height:100vh;margin:auto;padding:24px 20px 125px;background:#fff}
    .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:34px;gap:12px}
    .back{display:grid;place-items:center;width:34px;height:34px;color:var(--ink);text-decoration:none}
    .back svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .page-name{font-size:16px;font-weight:800}.brand{font-size:11px;color:var(--dark);font-weight:900;letter-spacing:.04em}
    .eyebrow{font-size:11px;font-weight:900;letter-spacing:.12em;color:var(--dark);margin-bottom:10px}
    h1{font-size:27px;line-height:1.35;letter-spacing:-.05em;margin:0 0 12px}
    .desc{font-size:13px;line-height:1.7;color:var(--muted);margin:0 0 30px}
    .field{margin-bottom:27px}.field-label{display:block;font-size:16px;font-weight:800;margin-bottom:11px}
    .hint{font-size:12px;color:var(--muted);line-height:1.6;margin:8px 0 0}
    input[type=text],textarea{width:100%;border:1.5px solid var(--border);border-radius:16px;background:white;padding:15px;font:14px/1.6 inherit;color:var(--ink)}
    input[type=text]:focus,textarea:focus{outline:none;border-color:var(--primary)}
    input::placeholder,textarea::placeholder{color:#9AA9AF}
    textarea{min-height:165px;resize:vertical;font-family:inherit}
    .search-row{display:flex;gap:8px}.search-row input{min-width:0;flex:1}
    .search-btn{border:0;border-radius:14px;background:var(--ink);color:white;padding:0 18px;font-size:13px;font-weight:800;cursor:pointer}
    .search-btn:disabled{opacity:.6;cursor:wait}
    .search-results{display:none;max-height:260px;overflow-y:auto;margin-top:10px;border:1px solid var(--border);border-radius:15px;background:#fff}
    .result-item{display:block;width:100%;padding:13px 14px;border:0;border-bottom:1px solid var(--border);background:white;text-align:left;cursor:pointer}
    .result-item:last-child{border-bottom:0}.result-item:hover{background:#F3FAFA}
    .result-name{font-size:14px;font-weight:800;color:var(--ink)}.result-address{margin-top:4px;font-size:12px;color:var(--muted);line-height:1.5}
    .search-message{padding:16px;color:var(--muted);font-size:13px}
    .selected-place{display:none;background:#F2FAFA;border:1px solid #D2E9E9;border-radius:16px;padding:15px;margin-top:11px}
    .selected-label{color:var(--dark);font-weight:800;font-size:11px;margin-bottom:6px}
    .selected-name{font-size:15px;font-weight:800}.selected-address{font-size:12px;color:#63787E;line-height:1.5;margin-top:5px}
    .star-row{display:flex;gap:6px;align-items:center}.star-row button{flex:1;min-width:0;border:1px solid var(--border);border-radius:12px;padding:10px 2px;font-size:25px;background:#FAFCFC;color:#C8D0D2;cursor:pointer;transition:.15s}
    .star-row button.filled{color:#F0AD46;background:#FFFAF1;border-color:#F6DFB8}.star-row button:focus-visible{outline:2px solid var(--dark);outline-offset:2px}
    .rating-help{margin-top:9px;font-size:12px;color:var(--muted)}
    .file-input{position:absolute;width:1px;height:1px;opacity:0}
    .upload-box{display:flex;align-items:center;gap:12px;padding:18px;border:1.5px dashed #C7DCDD;border-radius:17px;background:#F8FBFB;cursor:pointer}
    .upload-box svg{width:25px;height:25px;flex:none;stroke:var(--dark);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    .upload-title{font-size:14px;font-weight:800}.upload-sub{font-size:12px;color:var(--muted);margin-top:5px}
    .file-input:focus-visible + .upload-box{outline:2px solid var(--dark);outline-offset:3px}
    .preview{display:none;margin-top:12px;border:1px solid var(--border);border-radius:16px;overflow:hidden}
    .preview img{display:block;max-width:100%;width:100%;max-height:280px;object-fit:contain;background:#F7FAFA}
    .preview-info{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px}
    .filename{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;color:var(--muted)}
    .remove{background:none;border:0;color:#B66868;font-size:12px;font-weight:800;cursor:pointer;white-space:nowrap}
    .submit{width:100%;border:0;border-radius:17px;background:var(--primary);padding:17px;color:white;font-size:16px;font-weight:800;cursor:pointer}
    .submit:hover{background:var(--dark)}.submit:disabled{opacity:.65;cursor:wait}
    .cancel{display:block;text-align:center;text-decoration:none;color:var(--muted);font-size:13px;margin-top:18px}
    @media(max-width:360px){.app{padding-left:16px;padding-right:16px}.star-row button{font-size:22px}}
  </style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <a class="back" href="/reviews" aria-label="장소 후기 목록으로 돌아가기"><svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></a>
    <span class="page-name">장소 후기 작성</span><span class="brand">PINKSOLE</span>
  </header>
  <div class="eyebrow">SHARE YOUR PLACE</div>
  <h1>반려견과 함께한<br>장소를 소개해 주세요</h1>
  <p class="desc">함께 방문했던 제주 장소를 선택하고<br>솔직한 경험을 나눠주세요.</p>

  <form id="reviewForm" method="POST" enctype="multipart/form-data">
    <input type="hidden" name="place_name" id="placeName">
    <input type="hidden" name="place_address" id="placeAddress">
    <input type="hidden" name="place_category" id="placeCategory">
    <input type="hidden" name="place_latitude" id="placeLatitude">
    <input type="hidden" name="place_longitude" id="placeLongitude">
    <input type="hidden" name="rating" id="ratingValue" required>

    <section class="field">
      <label class="field-label" for="placeSearch">방문한 장소</label>
      <div class="search-row">
        <input id="placeSearch" type="text" placeholder="예: 함덕해수욕장" autocomplete="off">
        <button id="searchBtn" class="search-btn" type="button">검색</button>
      </div>
      <p class="hint">장소를 검색한 뒤 결과에서 선택해 주세요.</p>
      <div class="search-results" id="searchResults" aria-live="polite"></div>
      <div class="selected-place" id="selectedPlace">
        <div class="selected-label">✓ 선택한 장소</div>
        <div class="selected-name" id="selectedName"></div>
        <div class="selected-address" id="selectedAddress"></div>
      </div>
    </section>

    <section class="field">
      <div class="field-label" id="ratingLabel">장소 만족도</div>
      <div class="star-row" id="starRow" role="group" aria-labelledby="ratingLabel">
        <button type="button" data-rating="1" aria-label="1점">★</button>
        <button type="button" data-rating="2" aria-label="2점">★</button>
        <button type="button" data-rating="3" aria-label="3점">★</button>
        <button type="button" data-rating="4" aria-label="4점">★</button>
        <button type="button" data-rating="5" aria-label="5점">★</button>
      </div>
      <p class="rating-help" id="ratingHelp">별을 눌러 1~5점으로 평가해 주세요.</p>
    </section>

    <section class="field">
      <label class="field-label" for="content">방문 후기</label>
      <textarea id="content" name="content" placeholder="반려견 동반 경험, 좋았던 점, 주의할 점을 자유롭게 작성해 주세요." required></textarea>
    </section>

    <section class="field">
      <div class="field-label">사진 첨부 <span style="color:var(--muted);font-size:12px;font-weight:500">(선택)</span></div>
      <input class="file-input" id="image" name="image" type="file" accept="image/png,image/jpeg,image/webp,image/gif">
      <label class="upload-box" for="image">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="8.5" cy="9" r="1.5"/><path d="m4 17 6-6 4 4 3-3 4 4"/></svg>
        <span><span class="upload-title">방문 사진 추가하기</span><span class="upload-sub" style="display:block">사진 한 장을 첨부할 수 있어요.</span></span>
      </label>
      <div id="imagePreviewBox" class="preview">
        <img id="imagePreview" alt="첨부 사진 미리보기">
        <div class="preview-info"><span class="filename" id="imageFileName"></span><button type="button" class="remove" id="removeImage">사진 삭제</button></div>
      </div>
    </section>

    <button class="submit" id="submitBtn" type="submit">후기 등록하기 →</button>
    <a href="/reviews" class="cancel">취소하고 돌아가기</a>
  </form>
</div>
{% set active_page = '' %}
{% include 'components/bottomnav.html' %}
<script>
  const searchInput = document.getElementById('placeSearch');
  const results = document.getElementById('searchResults');
  const searchBtn = document.getElementById('searchBtn');
  const selectedPlace = document.getElementById('selectedPlace');
  const placeFields = ['placeName','placeAddress','placeCategory','placeLatitude','placeLongitude'];
  let searchNumber = 0;

  function clearPlace() {
    for (const id of placeFields) document.getElementById(id).value = '';
    selectedPlace.style.display = 'none';
  }

  function setSearchMessage(message) {
    results.replaceChildren();
    const div = document.createElement('div');
    div.className = 'search-message';
    div.textContent = message;
    results.appendChild(div);
    results.style.display = 'block';
  }

  function selectPlace(place) {
    const values = {
      placeName: place.name || '',
      placeAddress: place.address || '',
      placeCategory: place.category || '',
      placeLatitude: place.latitude ?? '',
      placeLongitude: place.longitude ?? ''
    };
    Object.entries(values).forEach(([id,value]) => document.getElementById(id).value = value);
    document.getElementById('selectedName').textContent = place.name || '';
    document.getElementById('selectedAddress').textContent = place.address || '주소 정보 없음';
    selectedPlace.style.display = 'block';
    searchInput.value = place.name || '';
    results.style.display = 'none';
  }

  async function searchPlace() {
    const query = searchInput.value.trim();
    if (!query) { alert('검색할 장소명을 입력해 주세요.'); return; }
    clearPlace();
    const current = ++searchNumber;
    searchBtn.disabled = true;
    setSearchMessage('장소를 검색하고 있어요...');
    try {
      const response = await fetch('/trip/manual/place/search?q=' + encodeURIComponent(query));
      const data = await response.json();
      if (current !== searchNumber) return;
      if (!response.ok || data.success === false) throw new Error(data.message || '장소 검색에 실패했습니다.');
      results.replaceChildren();
      if (!Array.isArray(data.places) || !data.places.length) {
        setSearchMessage('검색 결과가 없어요. 다른 장소명으로 검색해 주세요.');
        return;
      }
      data.places.forEach(place => {
        const button = document.createElement('button');
        button.type = 'button'; button.className = 'result-item';
        const name = document.createElement('div'); name.className = 'result-name'; name.textContent = place.name || '';
        const address = document.createElement('div'); address.className = 'result-address'; address.textContent = place.address || '주소 정보 없음';
        button.append(name,address);
        button.addEventListener('click', () => selectPlace(place));
        results.appendChild(button);
      });
      results.style.display = 'block';
    } catch (error) {
      if (current === searchNumber) setSearchMessage(error.message || '검색 중 오류가 발생했습니다.');
    } finally {
      if (current === searchNumber) searchBtn.disabled = false;
    }
  }
  document.getElementById('searchBtn').addEventListener('click', searchPlace);
  searchInput.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); searchPlace(); } });
  searchInput.addEventListener('input', () => {
    ++searchNumber; searchBtn.disabled = false; clearPlace(); results.style.display='none';
  });

  const ratingValue = document.getElementById('ratingValue');
  const starButtons = Array.from(document.querySelectorAll('[data-rating]'));
  starButtons.forEach(button => button.addEventListener('click', () => {
    const value = Number(button.dataset.rating);
    ratingValue.value = String(value);
    starButtons.forEach(star => {
      const filled = Number(star.dataset.rating) <= value;
      star.classList.toggle('filled', filled);
      star.setAttribute('aria-pressed', String(Number(star.dataset.rating) === value));
    });
    document.getElementById('ratingHelp').textContent = value + '점 선택됨';
  }));

  const imageInput = document.getElementById('image');
  const imagePreview = document.getElementById('imagePreview');
  const imagePreviewBox = document.getElementById('imagePreviewBox');
  let previewUrl = null;
  function clearImage() {
    if (previewUrl) URL.revokeObjectURL(previewUrl);
    previewUrl = null; imageInput.value = ''; imagePreview.removeAttribute('src');
    imagePreviewBox.style.display = 'none';
    document.getElementById('imageFileName').textContent = '';
  }
  imageInput.addEventListener('change', () => {
    if (previewUrl) URL.revokeObjectURL(previewUrl);
    previewUrl = null;
    const file = imageInput.files[0];
    if (!file) { clearImage(); return; }
    if (!['image/png','image/jpeg','image/webp','image/gif'].includes(file.type)) {
      alert('PNG, JPG, WEBP, GIF 형식의 사진을 선택해 주세요.'); clearImage(); return;
    }
    previewUrl = URL.createObjectURL(file); imagePreview.src = previewUrl;
    document.getElementById('imageFileName').textContent = file.name;
    imagePreviewBox.style.display = 'block';
  });
  document.getElementById('removeImage').addEventListener('click', clearImage);
  window.addEventListener('beforeunload', () => { if (previewUrl) URL.revokeObjectURL(previewUrl); });

  document.getElementById('reviewForm').addEventListener('submit', event => {
    if (!document.getElementById('placeName').value) {
      event.preventDefault(); alert('장소를 검색한 뒤 결과에서 선택해 주세요.'); searchInput.focus(); return;
    }
    if (!ratingValue.value) {
      event.preventDefault(); alert('별점을 선택해 주세요.'); return;
    }
    const btn = document.getElementById('submitBtn');
    btn.disabled = true; btn.textContent = '후기를 등록하고 있어요...';
  });
</script>
</body>
</html>
