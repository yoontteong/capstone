
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>{{ match.title }} - 메이트 채팅</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f6f7f9;
        }

        .app {
            max-width: 550px;
            height: 100dvh;
            margin: 0 auto;
            background: white;
            display: flex;
            flex-direction: column;
        }

        .header {
            padding: 18px 20px;
            border-bottom: 1px solid #eee;
        }

        .back {
            color: #555;
            text-decoration: none;
            font-size: 13px;
        }

        .header h2 {
            margin: 12px 0 6px;
            font-size: 19px;
        }

        .header p {
            margin: 0;
            font-size: 12px;
            color: #777;
        }

        .participants {
            padding: 12px 20px;
            background: #f3f8f3;
            border-bottom: 1px solid #e5eee5;
        }

        .participants-title {
            font-size: 12px;
            font-weight: bold;
            color: #2e7d32;
            margin-bottom: 7px;
        }

        .participants-list {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .participant {
            padding: 5px 9px;
            border-radius: 15px;
            background: white;
            color: #555;
            font-size: 12px;
        }

        .messages {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            padding: 20px 15px;
            background: #fafafa;
        }

        .empty {
            text-align: center;
            color: #999;
            font-size: 13px;
            margin-top: 40px;
        }

        .message-row {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            margin-bottom: 15px;
        }

        .message-row.mine {
            align-items: flex-end;
        }

        .sender {
            font-size: 12px;
            color: #777;
            margin-bottom: 5px;
        }

        .bubble {
            max-width: 80%;
            padding: 11px 13px;
            border-radius: 13px;
            background: white;
            border: 1px solid #eee;
            font-size: 14px;
            line-height: 1.5;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .mine .bubble {
            background: #dcf5df;
            border-color: #dcf5df;
        }

        .time {
            font-size: 10px;
            color: #999;
            margin-top: 5px;
        }

        .chat-form {
            display: flex;
            gap: 8px;
            padding: 12px;
            border-top: 1px solid #eee;
            background: white;
        }

        .chat-input {
            flex: 1;
            min-width: 0;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 11px;
            font-size: 14px;
            outline: none;
        }

        .chat-input:focus {
            border-color: #4caf50;
        }

        .send-btn {
            padding: 0 18px;
            border: none;
            border-radius: 11px;
            background: #4caf50;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .error {
            display: none;
            padding: 8px 15px;
            color: #c62828;
            background: #fff0f0;
            font-size: 12px;
        }
    </style>
</head>

<body>

<div class="app">

    <!-- 채팅방 정보 -->
    <div class="header">

        <a
            href="{{ url_for('community.match_detail', match_id=match.id) }}"
            class="back"
        >
            ← 모집글로 돌아가기
        </a>

        <h2>🐾 {{ match.title }}</h2>

        <p>메이트 단체 채팅방</p>

    </div>

    <!-- 참여자 -->
    <div class="participants">

        <div class="participants-title">
            👥 참여자 {{ participants|length }}명
        </div>

        <div class="participants-list">

            {% for participant in participants %}

                <span class="participant">

                    {{ participant.nickname }}

                    {% if participant.id == current_user_id %}
                        (나)
                    {% endif %}

                    {% if participant.id == match.user_id %}
                        👑
                    {% endif %}

                </span>

            {% endfor %}

        </div>

    </div>

    <!-- 메시지 표시 -->
    <div
        class="messages"
        id="messages"
        aria-live="polite"
        aria-relevant="additions"
    >
        <div class="empty" id="emptyMessage">
            아직 메시지가 없습니다.<br>
            첫 인사를 남겨보세요! 🐶
        </div>
    </div>

    <!-- 오류 표시 -->
    <div class="error" id="errorMessage"></div>

    <!-- 메시지 입력 -->
    <form class="chat-form" id="chatForm">

        <input
            type="text"
            class="chat-input"
            id="messageInput"
            maxlength="1000"
            placeholder="메시지를 입력하세요"
            autocomplete="off"
            required
        >

        <button
            type="submit"
            class="send-btn"
            id="sendButton"
        >
            전송
        </button>

    </form>

</div>

<script>
    const matchId = {{ match.id | tojson }};
    const currentUserId = {{ current_user_id | tojson }};

    const messagesBox = document.getElementById("messages");
    const emptyMessage = document.getElementById("emptyMessage");
    const chatForm = document.getElementById("chatForm");
    const messageInput = document.getElementById("messageInput");
    const sendButton = document.getElementById("sendButton");
    const errorMessage = document.getElementById("errorMessage");

    let lastMessageId = 0;
    let loading = false;
    let sending = false;

    function showError(message) {
        errorMessage.textContent = message;
        errorMessage.style.display = "block";
    }

    function clearError() {
        errorMessage.textContent = "";
        errorMessage.style.display = "none";
    }

    function appendMessage(message) {

        if (emptyMessage) {
            emptyMessage.style.display = "none";
        }

        const isMine =
            Number(message.sender_id) === Number(currentUserId);

        const row = document.createElement("div");
        row.className = "message-row" + (isMine ? " mine" : "");

        if (!isMine) {
            const sender = document.createElement("div");
            sender.className = "sender";
            sender.textContent = message.sender_name;
            row.appendChild(sender);
        }

        const bubble = document.createElement("div");
        bubble.className = "bubble";

        // textContent로 처리하여 HTML 실행 방지
        bubble.textContent = message.message;

        row.appendChild(bubble);

        const time = document.createElement("div");
        time.className = "time";
        time.textContent = message.created_at || "";

        row.appendChild(time);
        messagesBox.appendChild(row);
    }

    async function loadMessages() {

        if (loading || document.hidden) {
            return;
        }

        loading = true;

        try {
            const response = await fetch(
                `/matches/${matchId}/chat/messages?after_id=${lastMessageId}`,
                {
                    credentials: "same-origin",
                    cache: "no-store"
                }
            );

            const data = await response.json();

            if (!response.ok) {
                throw new Error(
                    data.error || "메시지를 불러오지 못했습니다."
                );
            }

            const messages = data.messages || [];

            const nearBottom =
                messagesBox.scrollHeight -
                messagesBox.scrollTop -
                messagesBox.clientHeight < 100;

            messages.forEach(message => {
                appendMessage(message);
                lastMessageId = Math.max(
                    lastMessageId,
                    Number(message.id)
                );
            });

            if (messages.length > 0 && nearBottom) {
                messagesBox.scrollTop = messagesBox.scrollHeight;
            }

            clearError();

            // 한 번에 100개가 조회되면 다음 묶음도 읽기
            if (messages.length === 100) {
                setTimeout(loadMessages, 0);
            }

        } catch (error) {
            showError(error.message);
        } finally {
            loading = false;
        }
    }

    chatForm.addEventListener("submit", async function(event) {

        event.preventDefault();

        if (sending) {
            return;
        }

        const message = messageInput.value.trim();

        if (!message) {
            return;
        }

        sending = true;
        sendButton.disabled = true;

        try {
            const response = await fetch(
                `/matches/${matchId}/chat/messages`,
                {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    credentials: "same-origin",
                    body: JSON.stringify({ message })
                }
            );

            const data = await response.json();

            if (!response.ok) {
                throw new Error(
                    data.error || "메시지 전송에 실패했습니다."
                );
            }

            messageInput.value = "";
            clearError();

            // 전송 직후 메시지 갱신
            await loadMessages();

        } catch (error) {
            showError(error.message);
        } finally {
            sending = false;
            sendButton.disabled = false;
            messageInput.focus();
        }
    });

    // 최초 메시지 조회
    loadMessages();

    // 3초마다 새 메시지 확인
    setInterval(loadMessages, 3000);

    // 다시 탭으로 돌아왔을 때 갱신
    document.addEventListener("visibilitychange", function() {
        if (!document.hidden) {
            loadMessages();
        }
    });
</script>

</body>
</html>
