<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>게시글 작성</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f6f7f9;
            color: #222;
        }

        .app {
            max-width: 430px;
            margin: 0 auto;
            min-height: 100vh;
            background: white;
            padding: 24px 20px 40px;
        }

        h1 {
            font-size: 24px;
            margin: 0 0 24px;
        }

        label {
            display: block;
            margin: 18px 0 8px;
            font-size: 14px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            border: 1px solid #ddd;
            border-radius: 14px;
            padding: 13px;
            font-size: 14px;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: #4caf50;
        }

        textarea {
            height: 220px;
            resize: vertical;
        }

        .submit-btn {
            width: 100%;
            border: none;
            border-radius: 16px;
            padding: 14px;
            margin-top: 24px;

            background: #4caf50;
            color: white;

            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .cancel-btn {
            display: block;
            text-align: center;
            text-decoration: none;

            margin-top: 16px;
            color: #666;
            font-size: 14px;
        }

        .image-help {
            margin-top: 6px;
            font-size: 12px;
            color: #777;
        }
    </style>
</head>

<body>

<div class="app">

    <h1>✏️ 게시글 작성</h1>

    <form method="POST" enctype="multipart/form-data">

        <label for="author">
            작성자
        </label>

        <input
            id="author"
            name="author"
            type="text"
            maxlength="50"
            placeholder="닉네임"
            required
        >


        <label for="title">
            제목
        </label>

        <input
            id="title"
            name="title"
            type="text"
            maxlength="200"
            placeholder="제목을 입력해주세요"
            required
        >


        <label for="content">
            내용
        </label>

        <textarea
            id="content"
            name="content"
            placeholder="반려견과 함께한 여행 이야기를 공유해주세요."
            required
        ></textarea>

        <label for="image">
            사진
        </label>

        <input
            id="image"
            name="image"
            type="file"
            accept="image/png, image/jpeg, image/gif, image/webp"
        >

        <div class="image-help">
            여행 사진을 한 장 첨부할 수 있습니다.
        </div>


        <button
            class="submit-btn"
            type="submit">
            등록하기
        </button>

    </form>


    <a
        href="/community"
        class="cancel-btn">
        취소
    </a>

</div>

</body>
</html>
