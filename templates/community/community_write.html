
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>게시글 작성 | PINKSOLE</title>

    <!-- 공통 하단 내비게이션 -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/bottomnav.css') }}">

    <style>
        :root {
            --primary: #49B9BF;
            --primary-dark: #278D95;
            --primary-light: #E7F7F7;
            --ink: #202B33;
            --muted: #7C8A93;
            --border: #E8EEF0;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: 'Pretendard', 'Noto Sans KR',
                         Arial, sans-serif;
            background: #F3F6F7;
            color: var(--ink);
        }

        .app {
            width: 100%;
            max-width: 460px;
            min-height: 100vh;
            margin: 0 auto;
            padding: 24px 20px 125px;
            background: white;
        }

        /* 상단 헤더 */
        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 35px;
        }

        .back-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 34px;
            height: 34px;
            color: var(--ink);
            text-decoration: none;
        }

        .back-btn svg {
            width: 23px;
            height: 23px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .top-title {
            font-size: 16px;
            font-weight: 800;
        }

        .brand {
            color: var(--primary-dark);
            font-size: 11px;
            font-weight: 900;
            letter-spacing: .04em;
        }

        /* 페이지 소개 */
        .header {
            margin-bottom: 32px;
        }

        .eyebrow {
            margin-bottom: 10px;
            color: var(--primary-dark);
            font-size: 11px;
            font-weight: 900;
            letter-spacing: .12em;
        }

        .header h1 {
            margin: 0 0 12px;
            font-size: 27px;
            font-weight: 800;
            line-height: 1.35;
            letter-spacing: -.05em;
        }

        .description {
            margin: 0;
            color: var(--muted);
            font-size: 13px;
            line-height: 1.7;
        }

        /* 입력 영역 */
        .section {
            margin-bottom: 28px;
        }

        .section-title {
            display: block;
            margin-bottom: 12px;
            font-size: 16px;
            font-weight: 800;
            letter-spacing: -.03em;
        }

        .required {
            color: var(--primary-dark);
        }

        input[type="text"],
        textarea {
            display: block;
            width: 100%;
            padding: 16px;
            border: 1.5px solid var(--border);
            border-radius: 16px;
            background: #FFFFFF;
            color: var(--ink);
            font-family: inherit;
            font-size: 14px;
            line-height: 1.6;
            transition: border-color .2s;
        }

        input::placeholder,
        textarea::placeholder {
            color: #A0ADB3;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: var(--primary);
        }

        textarea {
            min-height: 230px;
            resize: vertical;
        }

        .input-help {
            margin-top: 9px;
            color: var(--muted);
            font-size: 12px;
            line-height: 1.6;
        }

        /* 사진 첨부 */
        .file-input {
            position: absolute;
            width: 1px;
            height: 1px;
            opacity: 0;
            overflow: hidden;
        }

        .upload-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 9px;

            min-height: 145px;
            padding: 22px;
            border: 1.5px dashed #C9DCDD;
            border-radius: 19px;
            background: #F8FBFB;

            cursor: pointer;
            transition: .2s;
            text-align: center;
        }

        .upload-box:hover {
            background: var(--primary-light);
            border-color: var(--primary);
        }

        .upload-box:focus-within {
            outline: 3px solid var(--primary);
            outline-offset: 3px;
        }

        .upload-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 46px;
            height: 46px;
            border-radius: 15px;
            background: var(--primary-light);
            color: var(--primary-dark);
        }

        .upload-icon svg {
            width: 23px;
            height: 23px;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .upload-title {
            color: var(--ink);
            font-size: 14px;
            font-weight: 800;
        }

        .upload-description {
            color: var(--muted);
            font-size: 12px;
        }

        /* 사진 미리보기 */
        .preview-container {
            display: none;
            margin-top: 14px;
            border: 1px solid var(--border);
            border-radius: 18px;
            overflow: hidden;
            background: #F8FBFB;
        }

        .preview-image {
            display: block;
            width: 100%;
            max-height: 280px;
            object-fit: contain;
        }

        .preview-bottom {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 12px 14px;
        }

        .preview-filename {
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: var(--muted);
            font-size: 12px;
        }

        .remove-image {
            flex-shrink: 0;
            border: none;
            background: transparent;
            color: #B66868;
            font-family: inherit;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }

        /* 안내 */
        .notice {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 24px;
            padding: 15px;
            border-radius: 16px;
            background: #F2F9F9;
            color: #60757D;
            font-size: 12px;
            line-height: 1.7;
        }

        .notice-icon {
            flex-shrink: 0;
            color: var(--primary-dark);
            font-size: 17px;
        }

        /* 등록 버튼 */
        .submit-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 18px;
            border: none;
            border-radius: 17px;
            background: var(--primary);
            color: white;
            font-family: inherit;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            transition: background .2s;
            box-shadow: 0 6px 16px
                        rgba(73, 185, 191, .18);
        }

        .submit-btn:hover {
            background: var(--primary-dark);
        }

        .submit-btn:disabled {
            opacity: .65;
            cursor: wait;
        }

        .cancel-btn {
            display: block;
            margin-top: 18px;
            color: var(--muted);
            text-align: center;
            text-decoration: none;
            font-size: 13px;
        }

        @media (max-width: 360px) {
            .app {
                padding-left: 16px;
                padding-right: 16px;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <!-- 상단 헤더 -->
    <header class="topbar">
        <a href="/community"
           class="back-btn"
           aria-label="자유게시판으로 돌아가기">
            <svg viewBox="0 0 24 24">
                <path d="M19 12H5"></path>
                <path d="M12 19L5 12L12 5"></path>
            </svg>
        </a>

        <div class="top-title">게시글 작성</div>

        <div class="brand">PINKSOLE</div>
    </header>

    <!-- 소개 -->
    <section class="header">
        <div class="eyebrow">SHARE YOUR STORY</div>

        <h1>
            당신의 여행 이야기를<br>
            들려주세요
        </h1>

        <p class="description">
            반려견과 함께한 소중한 경험이나<br>
            궁금한 점을 자유롭게 공유해 보세요.
        </p>
    </section>

    <!-- 게시글 작성 -->
    <form method="POST"
          action="/community/write"
          enctype="multipart/form-data"
          id="writeForm">

        <!-- 제목 -->
        <section class="section">
            <label for="title" class="section-title">
                제목 <span class="required">*</span>
            </label>

            <input
                id="title"
                name="title"
                type="text"
                maxlength="200"
                placeholder="제목을 입력해 주세요"
                required>
        </section>

        <!-- 내용 -->
        <section class="section">
            <label for="content" class="section-title">
                내용 <span class="required">*</span>
            </label>

            <textarea
                id="content"
                name="content"
                placeholder="반려견과 함께한 여행 이야기를 공유해 주세요."
                required></textarea>

            <div class="input-help">
                서로를 배려하는 따뜻한 이야기를 나눠 주세요.
            </div>
        </section>

        <!-- 사진 -->
        <section class="section">
            <div class="section-title">
                사진 첨부
                <span style="
                    color: var(--muted);
                    font-size: 12px;
                    font-weight: 500;">
                    (선택)
                </span>
            </div>

            <label for="image" class="upload-box">
                <span class="upload-icon">
                    <svg viewBox="0 0 24 24">
                        <rect x="3" y="4"
                              width="18" height="16"
                              rx="3"></rect>
                        <circle cx="8.5" cy="9"
                                r="1.5"></circle>
                        <path d="M4 17L10 11L14 15L17 12L21 16"></path>
                    </svg>
                </span>

                <span class="upload-title">
                    여행 사진 추가하기
                </span>

                <span class="upload-description">
                    사진 한 장을 첨부할 수 있어요.
                </span>
            </label>

            <input
                id="image"
                name="image"
                class="file-input"
                type="file"
                accept="image/png,image/jpeg,image/gif,image/webp">

            <!-- 미리보기 -->
            <div id="previewContainer"
                 class="preview-container">

                <img id="imagePreview"
                     class="preview-image"
                     alt="첨부할 사진 미리보기">

                <div class="preview-bottom">
                    <span id="fileName"
                          class="preview-filename"></span>

                    <button
                        type="button"
                        class="remove-image"
                        id="removeImage">
                        사진 삭제
                    </button>
                </div>
            </div>
        </section>

        <!-- 안내 -->
        <div class="notice">
            <span class="notice-icon">✦</span>

            <div>
                게시글은 다른 사용자에게 공개됩니다.
                개인 연락처나 민감한 정보는
                포함하지 않는 것을 권장해요.
            </div>
        </div>

        <!-- 등록 -->
        <button type="submit"
                class="submit-btn"
                id="submitBtn">
            게시글 등록하기
            <span>→</span>
        </button>

        <a href="/community" class="cancel-btn">
            취소하고 돌아가기
        </a>

    </form>

</div>

<!-- 공통 하단 내비게이션 -->
{% set active_page = '' %}
{% include 'components/bottomnav.html' %}

<script>
    const imageInput =
        document.getElementById("image");

    const previewContainer =
        document.getElementById("previewContainer");

    const imagePreview =
        document.getElementById("imagePreview");

    const fileName =
        document.getElementById("fileName");

    const removeImage =
        document.getElementById("removeImage");

    let previewUrl = null;

    imageInput.addEventListener("change", function() {
        const file = this.files[0];

        if (previewUrl) {
            URL.revokeObjectURL(previewUrl);
            previewUrl = null;
        }

        if (!file) {
            previewContainer.style.display = "none";
            imagePreview.removeAttribute("src");
            return;
        }

        if (!file.type.startsWith("image/")) {
            alert("이미지 파일만 선택할 수 있습니다.");
            this.value = "";
            previewContainer.style.display = "none";
            return;
        }

        previewUrl = URL.createObjectURL(file);

        imagePreview.src = previewUrl;
        fileName.textContent = file.name;

        previewContainer.style.display = "block";
    });

    removeImage.addEventListener("click", function() {
        imageInput.value = "";

        if (previewUrl) {
            URL.revokeObjectURL(previewUrl);
            previewUrl = null;
        }

        imagePreview.removeAttribute("src");
        fileName.textContent = "";
        previewContainer.style.display = "none";
    });

    window.addEventListener("beforeunload", function() {
        if (previewUrl) {
            URL.revokeObjectURL(previewUrl);
        }
    });

    const writeForm =
        document.getElementById("writeForm");

    const submitBtn =
        document.getElementById("submitBtn");

    writeForm.addEventListener("submit", function() {
        submitBtn.disabled = true;
        submitBtn.textContent = "게시글 등록 중...";
    });
</script>

</body>
</html>
