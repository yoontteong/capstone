<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>게시글 수정</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f6f7f9;
            color: #222;
        }

        .app {
            max-width: 430px;
            margin: 0 auto;
            min-height: 100vh;
            background: white;
            padding: 24px 20px 40px;
        }

        h1 {
            font-size: 24px;
            margin: 0 0 24px;
        }

        label {
            display: block;
            margin: 18px 0 8px;
            font-size: 14px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            border: 1px solid #ddd;
            border-radius: 14px;
            padding: 13px;
            font-size: 14px;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: #4caf50;
        }

        textarea {
            height: 220px;
            resize: vertical;
        }

        .save-btn {
            width: 100%;
            border: none;
            border-radius: 16px;
            padding: 14px;
            margin-top: 24px;

            background: #4caf50;
            color: white;

            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .cancel-btn {
            display: block;
            text-align: center;
            text-decoration: none;
            margin-top: 16px;
            color: #666;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div class="app">

    <h1>✏️ 게시글 수정</h1>

    <form method="POST">

        <label for="author">
            작성자
        </label>

        <input
            id="author"
            name="author"
            type="text"
            maxlength="50"
            value="{{ post.author }}"
            required
        >


        <label for="title">
            제목
        </label>

        <input
            id="title"
            name="title"
            type="text"
            maxlength="200"
            value="{{ post.title }}"
            required
        >


        <label for="content">
            내용
        </label>

        <textarea
            id="content"
            name="content"
            required>{{ post.content }}</textarea>


        <button
            class="save-btn"
            type="submit">
            수정 완료
        </button>

    </form>


    <a
        href="/community/{{ post.id }}"
        class="cancel-btn">
        취소
    </a>

</div>

</body>
</html>
