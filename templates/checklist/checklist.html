<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>준비물 체크리스트</title>

    

<link rel="stylesheet" href="{{ url_for('static', filename='css/bottomnav.css') }}">
<style>

/* Activity 화면의 시각 언어를 체크리스트에 반영한 스타일 */
:root {--primary:#49B9BF;--dark:#FF9808;--soft:#E7F7F7;--ink:#202B33;--muted:#74858D;--line:#E7EEF0;}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0!important;background:#F3F6F7!important;color:var(--ink)!important;font-family:'Pretendard','Noto Sans KR',Arial,sans-serif!important;padding-bottom:0!important}
.app{max-width:460px!important;min-height:100vh!important;margin:0 auto!important;background:#fff!important;padding:24px 20px 120px!important;box-shadow:none!important}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px;gap:10px}
.topbar a{color:var(--ink);text-decoration:none;font-size:21px;line-height:1}
.topbar strong{font-size:16px;font-weight:800;letter-spacing:-.03em}
.topbar .brand{color:var(--dark);font-size:11px;font-weight:900;letter-spacing:.04em}
.eyebrow{color:var(--dark);font-size:11px;letter-spacing:.11em;font-weight:900;margin-bottom:7px}
.app .header{margin:0 0 25px!important}
.app .header h1{font-size:27px;line-height:1.25;letter-spacing:-.05em;margin:0 0 8px;color:var(--ink)}
.app .description{color:var(--muted)!important;font-size:13px!important;line-height:1.65!important;margin:0!important}
button,input,select{font-family:inherit}
button,a{touch-action:manipulation}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--primary)!important;outline-offset:2px}
.app .back{display:block;margin-top:22px;text-align:center;font-size:13px;font-weight:750;color:#597B80;text-decoration:none}
.app .submit-btn,.app .create-btn,.app .add-btn{background:var(--primary)!important;color:#153A3E!important;border:0!important;border-radius:17px!important;font-weight:850!important;box-shadow:0 5px 14px rgba(73,185,191,.16)!important;cursor:pointer}
.app .submit-btn,.app .create-btn{display:block;text-align:center;text-decoration:none;width:100%;padding:17px 14px!important;font-size:15px!important}
.app .submit-btn:hover,.app .create-btn:hover,.app .add-btn:hover{filter:brightness(.97)}
.app .submit-btn:active,.app .create-btn:active,.app .add-btn:active{transform:scale(.99)}
.app input:not([type=checkbox]),.app select{display:block;min-width:0;background:#FAFCFC!important;border:1px solid var(--line)!important;border-radius:14px!important;padding:14px 15px!important;color:var(--ink)!important;min-height:49px;font-size:14px}
.app label{color:var(--ink)}
.app .form-panel{background:linear-gradient(145deg,#E7F7F7,#F5FBFB);border:1px solid #D7EDED;border-radius:23px;padding:20px;margin-bottom:16px}
.app .form-panel label{display:block;font-size:13px;font-weight:800;margin:0 0 9px}
.app .form-panel .field{margin-bottom:18px}
.app .form-panel .field:last-child{margin-bottom:0}
.app .help{margin:10px 0 0;color:#577B81;font-size:12px;line-height:1.55}
.app .checklist-card{border:1px solid var(--line)!important;border-radius:19px!important;background:#fff!important;padding:18px!important;margin:0 0 13px!important;box-shadow:0 4px 15px rgba(32,43,51,.035)!important}
.app .checklist-card .title{font-weight:850;font-size:17px;color:var(--ink);line-height:1.4}
.app .checklist-card .info{font-size:12px;color:var(--muted);margin:8px 0}
.app .checklist-card .progress{background:var(--soft);border-radius:11px;padding:10px 12px;color:#326B70!important;font-size:12px;margin:13px 0 0}
.app .delete-btn,.app .delete{background:#FFF0EE!important;color:#A7423C!important;border:1px solid #F5CFCC!important;box-shadow:none!important;cursor:pointer}
.app .delete-btn{margin-top:12px!important;padding:11px!important;border-radius:12px!important;font-size:13px!important}
.app .empty{border:1px dashed #CBDADD!important;border-radius:20px!important;background:#FAFCFC;padding:34px 20px!important;color:var(--muted);line-height:1.8;font-size:14px}
.app .info-card{background:linear-gradient(145deg,#E7F7F7,#F5FBFB)!important;border:1px solid #D7EDED!important;border-radius:23px!important;padding:20px!important;margin-bottom:24px!important}
.app .info-card .info{font-size:13px;color:#52777D;margin:9px 0}
.app .info-card .info strong{color:#264C52;display:inline-block;min-width:76px}
.app .item{display:flex;align-items:center;gap:10px;background:#fff!important;border:1px solid var(--line)!important;border-radius:15px!important;padding:14px!important;margin:0 0 10px!important}
.app .item:has(input:checked){background:#F5FBFB!important;border-color:#D7EDED!important}
.app .item label{flex:1;min-width:0;display:flex;align-items:center;gap:11px;cursor:pointer}
.app .item label span{font-size:14px;color:var(--ink);overflow-wrap:anywhere}
.app .item input[type=checkbox]{width:20px;height:20px;flex:none;accent-color:var(--primary)!important}
.app .item input[type=checkbox]:checked+span{color:#80999B;text-decoration:line-through}
.app .delete{padding:8px 11px!important;border-radius:10px!important;font-size:12px!important;flex:none}
.app .add-area{display:flex;gap:9px;margin:21px 0 0;align-items:stretch}
.app .add-area input{flex:1;width:0;min-width:0}
.app .add-btn{padding:12px 17px!important;white-space:nowrap}
.app .nav-area{display:flex;gap:10px;margin-top:22px}
.app .nav-btn{flex:1;background:#F3FAFA!important;border:1px solid #B7DEDF!important;color:#39787D!important;border-radius:14px!important;padding:13px!important;font-weight:800!important}
.app .section-label{font-size:16px;font-weight:850;color:var(--ink);margin:23px 0 12px}
@media(max-width:360px){.app{padding-left:16px!important;padding-right:16px!important}.app .header h1{font-size:24px}}

</style>

<style>
/* PinkSole · 내 여행 화면 기준 UI 통일 (기능/하단 메뉴 변경 없음) */
:root {
  --primary: #00CBD7; --primary-dark: #00A8B4; --primary-light: #E8F8F9;
  --dark: #FF8800; --soft: #E8F8F9; --ink: #142739;
  --muted: #8290A4; --line: #E5ECF0; --border: #E5ECF0;
  --background: #FFFFFF; --orange: #FF8800;
}
html {scroll-behavior:smooth}
body {background:#F6F8F9!important;color:#142739!important;font-family:'Pretendard','Noto Sans KR',Arial,sans-serif!important;}
.app {max-width:530px!important;background:#FFF!important;box-shadow:0 0 20px rgba(19,43,55,.018)!important;padding-left:24px!important;padding-right:24px!important;padding-bottom:125px!important;}
.topbar {min-height:37px;display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:42px!important;}
.topbar a,.back-btn:not(.button) {color:#142739!important;text-decoration:none;}
.topbar strong,.top-title {font-weight:850!important;font-size:16px!important;letter-spacing:-.035em;}
.brand,.topbar .brand,.eyebrow,.section-overline {color:#FF8800!important;font-weight:900!important;}
.eyebrow {font-size:12px!important;letter-spacing:.13em!important;margin-bottom:17px!important;}
.app h1,.app .header h1,.intro h1 {color:#142739!important;font-size:28px!important;font-weight:850!important;letter-spacing:-.055em!important;line-height:1.3!important;}
.description,.subtitle,.intro .description,.app .description,.date {color:#8290A4!important;line-height:1.75!important;font-size:13px!important;}
.app .header,.intro {margin-bottom:30px!important;}
.section-label,.section-title,.section-heading h2,.map-heading h2,.detail-title {color:#142739!important;font-weight:850!important;}
/* 여행 카드처럼 흰 바탕, 얇은 테두리, 부드러운 그림자 */
.app .dog-picker,.app .dog-box,.app .dog-card,.app .checklist-card,
.app .record-card,.app .detail-box,.app .item,.app .pattern-box {
  background:#FFF!important;border:1px solid #E5ECF0!important;
  border-radius:22px!important;box-shadow:0 5px 18px rgba(30,57,72,.045)!important;
}
.app .dog-picker,.app .dog-box,.app .dog-card {padding:18px!important;}
.app .dog-avatar,.app .dog-icon,.app .empty-icon {background:#E8F8F9!important;border-radius:16px!important;}
/* 데이터 카드: 눈부신 원색 대신 부드러운 민트 */
.app .distance-panel,.app .score-box,.app .info-card,.app .form-panel {
  background:#E8F8F9!important;border:1px solid #D7EFF1!important;
  border-radius:23px!important;color:#142739!important;box-shadow:none!important;
}
.app .distance-caption,.app .distance-number,.app .distance-unit,
.app .score,.app .score-label {color:#163C47!important;}
.app .summary-card,.app .stat {background:#FFF!important;border:1px solid #E5ECF0!important;border-radius:16px!important;}
.app .summary-value,.app .stat-value,.app .value {color:#142739!important;}
.app .summary-label,.app .stat-label,.app .label {color:#8290A4!important;}
.app #status,.app .notice {background:#EEF9FA!important;color:#4E737B!important;border-radius:14px!important;}
.app .checklist-card .progress,.app .progress {background:#E8F8F9!important;color:#187D86!important;border-radius:12px!important;}
.app .item:has(input:checked) {background:#F1FAFA!important;border-color:#CBECEF!important;}
.app .item input[type=checkbox] {accent-color:#00A8B4!important;}
.app #map {border:1px solid #DFE9EE!important;border-radius:20px!important;}
/* 내 여행의 '새 여행 만들기'와 같은 선명한 청록색 CTA */
.app .main-action:not(.recording),.app .action-primary,.app .submit-btn,
.app .create-btn,.app .add-btn,.app .history-btn.button,.app .button.history-btn {
  background:#00CBD7!important;color:#FFF!important;border:0!important;
  border-radius:17px!important;font-weight:850!important;
  box-shadow:0 10px 20px rgba(0,166,180,.12)!important;
}
.app .main-action.recording {background:#FFF0EE!important;color:#A7423C!important;border:1px solid #F5CFCC!important;box-shadow:none!important;}
.app #saveBtn,.app .action-secondary,.app .nav-btn,.app .home-btn.button,.app .button.home-btn {
  background:#E8F8F9!important;color:#157E87!important;border:1px solid #CDEDEF!important;
  border-radius:16px!important;box-shadow:none!important;
}
.app .delete,.app .delete-btn {background:#FFF1F1!important;color:#C25858!important;border:1px solid #F6DDDD!important;box-shadow:none!important;}
.app .history-btn:not(.button),.app .card-footer,.app .score-row strong {color:#FF8800!important;}
.app input:not([type=checkbox]):not([type=radio]),.app select,.app textarea {
  border:1px solid #E2EAF0!important;border-radius:14px!important;
  background:#FFF!important;color:#142739!important;
}
:focus-visible {outline:3px solid #00A8B4!important;outline-offset:3px;}
@media(max-width:480px){.app{max-width:460px!important;padding-left:20px!important;padding-right:20px!important;}}
@media(max-width:360px){.app{padding-left:16px!important;padding-right:16px!important;}}
</style>
</head>

<body>
<div class="app">

    <header class="topbar"><a href="/checklists" aria-label="뒤로가기">←</a><strong>새 체크리스트</strong><span class="brand">PINKSOLE</span></header>
<div class="header"><div class="eyebrow">PACKING CHECKLIST</div><h1>여행 준비, 가볍게</h1><p class="description">여행 날짜와 활동 조건을 선택하면 필요한 준비물을 추천해 드려요.</p></div>

    <form action="/checklist-result" method="post">

        <div class="form-panel"><div class="field"><label for="travel_date">
            여행 날짜
        </label>

        <input
            type="date"
            id="travel_date"
            name="travel_date"
            required
        >


        </div><div class="field"><label for="stay">
            숙박 여부
        </label>

        <select
            id="stay"
            name="stay"
            required
        >
            <option value="no">
                당일치기
            </option>

            <option value="yes">
                숙박
            </option>
        </select>


        </div><div class="field"><label for="outdoor">
            야외 활동 여부
        </label>

        <select
            id="outdoor"
            name="outdoor"
            required
        >
            <option value="yes">
                있음
            </option>

            <option value="no">
                없음
            </option>
        </select>


        </div></div>
<button
            type="submit"
            class="submit-btn"
        >
            준비물 추천받기
        </button>

    </form>


    <a
        href="/checklists"
        class="back"
    >
        내 체크리스트로 돌아가기
    </a>

</div>


{% set active_page = 'mypage' %}
{% include 'components/bottomnav.html' %}
</body>
</html>
