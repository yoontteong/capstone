<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>준비물 체크리스트</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f6f7f9;
            color: #222;
        }

        .app {
            max-width: 500px;
            margin: 0 auto;
            min-height: 100vh;
            background: white;
            padding: 30px 20px 40px;
        }

        .header {
            margin-bottom: 24px;
        }

        .header h2 {
            margin: 0 0 8px;
            font-size: 24px;
        }

        .description {
            color: #777;
            font-size: 13px;
            line-height: 1.5;
        }

        label {
            display: block;
            margin: 18px 0 8px;
            font-weight: bold;
            font-size: 14px;
        }

        input,
        select {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 12px;
            font-size: 14px;
            background: white;
        }

        .submit-btn {
            width: 100%;
            margin-top: 26px;
            padding: 14px;

            border: none;
            border-radius: 14px;

            background: #4caf50;
            color: white;

            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .submit-btn:hover {
            background: #43a047;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;

            color: #666;
            text-decoration: none;
            font-size: 14px;
        }

        .back:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

<div class="app">

    <div class="header">
        <h2>🎒 준비물 체크리스트</h2>

        <div class="description">
            여행 조건과 제주 날씨에 맞는 준비물을 추천해드립니다.
        </div>
    </div>

    <form action="/checklist-result" method="post">

        <label for="travel_date">
            여행 날짜
        </label>

        <input
            type="date"
            id="travel_date"
            name="travel_date"
            required
        >


        <label for="stay">
            숙박 여부
        </label>

        <select
            id="stay"
            name="stay"
            required
        >
            <option value="no">
                당일치기
            </option>

            <option value="yes">
                숙박
            </option>
        </select>


        <label for="outdoor">
            야외 활동 여부
        </label>

        <select
            id="outdoor"
            name="outdoor"
            required
        >
            <option value="yes">
                있음
            </option>

            <option value="no">
                없음
            </option>
        </select>


        <button
            type="submit"
            class="submit-btn"
        >
            준비물 추천받기
        </button>

    </form>


    <a
        href="/checklists"
        class="back"
    >
        내 체크리스트로 돌아가기
    </a>

</div>

</body>
</html>
