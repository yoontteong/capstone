<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>체크리스트 상세</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f6f7f9;
            color: #222;
        }

        .app {
            max-width: 500px;
            margin: 0 auto;
            min-height: 100vh;
            background: white;
            padding: 30px 20px 40px;
        }

        .header {
            margin-bottom: 22px;
        }

        .header h2 {
            margin: 0 0 8px;
            font-size: 24px;
        }

        .description {
            color: #777;
            font-size: 13px;
        }

        .info-card {
            padding: 18px;
            margin-bottom: 20px;

            background: #f3f8f3;
            border-radius: 16px;
        }

        .info {
            margin: 7px 0;
            font-size: 14px;
            color: #555;
        }

        .checklist {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;

            padding: 14px 15px;
            margin-bottom: 10px;

            border: 1px solid #e7e7e7;
            border-radius: 14px;
        }

        .item label {
            display: flex;
            align-items: center;
            gap: 10px;

            flex: 1;
            cursor: pointer;
        }

        .item input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #4caf50;
        }

        .item span {
            font-size: 14px;
        }

        .delete {
            border: none;
            border-radius: 10px;

            padding: 8px 11px;

            background: #fff0f0;
            color: #d32f2f;

            font-weight: bold;
            cursor: pointer;
        }

        .add-area {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .add-area input {
            flex: 1;

            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 12px;

            font-size: 14px;
        }

        .add-btn {
            padding: 12px 16px;

            border: none;
            border-radius: 12px;

            background: #4caf50;
            color: white;

            font-weight: bold;
            cursor: pointer;
        }

        .nav-area {
            display: flex;
            gap: 10px;
            margin-top: 22px;
        }

        .nav-btn {
            flex: 1;

            padding: 13px;

            border: none;
            border-radius: 12px;

            background: #e8f5e9;
            color: #2e7d32;

            font-weight: bold;
            cursor: pointer;
        }

        .back {
            display: block;
            text-align: center;

            margin-top: 20px;

            color: #666;
            text-decoration: none;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div class="app">

    <div class="header">
        <h2>🎒 {{ checklist.title }}</h2>

        <div class="description">
            여행 전에 하나씩 체크해보세요.
        </div>
    </div>


    <div class="info-card">

        <div class="info">
            <strong>여행지</strong> 제주도
        </div>

        <div class="info">
            <strong>날짜</strong> {{ checklist.travel_date }}
        </div>

        <div class="info">
            <strong>예상 날씨</strong> {{ checklist.weather }}
        </div>

    </div>


    <ul
        id="checklist"
        class="checklist"
    >

        {% for item in items %}

            <li class="item">

                <label>
                    <input
                        type="checkbox"
                        onchange="toggleItem({{ item.id }}, this.checked)"
                        {% if item.is_checked %}checked{% endif %}
                    >

                    <span>
                        {{ item.item_name }}
                    </span>
                </label>

                <button
                    class="delete"
                    onclick="deleteItem({{ item.id }}, this)"
                >
                    삭제
                </button>

            </li>

        {% endfor %}

    </ul>


    <div class="add-area">

        <input
            type="text"
            id="newItem"
            placeholder="준비물 추가"
        >

        <button
            class="add-btn"
            onclick="addItem()"
        >
            추가
        </button>

    </div>


    <div class="nav-area">

        <button
            class="nav-btn"
            onclick="location.href='/checklist'"
        >
            새 체크리스트
        </button>

        <button
            class="nav-btn"
            onclick="location.href='/checklists'"
        >
            목록으로
        </button>

    </div>


    <a
        href="/"
        class="back"
    >
        메인으로 돌아가기
    </a>

</div>


<script>

    function toggleItem(itemId, checked) {

        fetch("/checklist/item/toggle", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                item_id: itemId,
                is_checked: checked
            })
        })
        .then(response => response.json())
        .then(data => {

            if (!data.success) {
                alert("체크 상태 저장에 실패했습니다.");
            }

        });
    }


    function addItem() {

        const input =
            document.getElementById("newItem");

        const value =
            input.value.trim();

        if (value === "") {
            return;
        }

        fetch("/checklist/item/add", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                checklist_id: {{ checklist.id }},
                item_name: value
            })
        })
        .then(response => response.json())
        .then(data => {

            if (!data.success) {
                alert("준비물 추가에 실패했습니다.");
                return;
            }

            const ul =
                document.getElementById("checklist");

            const li =
                document.createElement("li");

            li.className = "item";

            li.innerHTML = `
                <label>
                    <input
                        type="checkbox"
                        onchange="toggleItem(${data.item_id}, this.checked)"
                    >

                    <span>
                        ${value}
                    </span>
                </label>

                <button
                    class="delete"
                    onclick="deleteItem(${data.item_id}, this)"
                >
                    삭제
                </button>
            `;

            ul.appendChild(li);

            input.value = "";
        });
    }


    function deleteItem(itemId, button) {

        if (!confirm("이 준비물을 삭제하시겠습니까?")) {
            return;
        }

        fetch("/checklist/item/delete", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                item_id: itemId
            })
        })
        .then(response => response.json())
        .then(data => {

            if (!data.success) {
                alert("준비물 삭제에 실패했습니다.");
                return;
            }

            button
                .parentElement
                .remove();
        });
    }

</script>

</body>
</html>
