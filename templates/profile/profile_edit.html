<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>프로필 수정 | 반려견 제주 여행</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f7f8fa;
            color: #333;
        }

        .page {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .edit-container {
            width: 100%;
            max-width: 440px;

            background: white;
            border-radius: 20px;
            padding: 38px 34px;

            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        /* ==============================
           상단
        ============================== */

        .top {
            position: relative;
            text-align: center;
            margin-bottom: 30px;
        }

        .back-button {
            position: absolute;
            left: 0;
            top: 3px;

            color: #777;
            text-decoration: none;
            font-size: 14px;
        }

        .back-button:hover {
            color: #333;
        }

        h1 {
            margin: 0;
            font-size: 24px;
        }

        .description {
            margin: 9px 0 0;
            color: #888;
            font-size: 13px;
        }

        /* ==============================
           프로필 사진
        ============================== */

        .profile-area {
            text-align: center;
            margin-bottom: 30px;
        }

        .profile-image-wrapper {
            position: relative;

            width: 110px;
            height: 110px;

            margin: 0 auto 13px;

            border-radius: 50%;
            background: #fff1ee;

            overflow: hidden;

            display: flex;
            align-items: center;
            justify-content: center;

            cursor: pointer;

            border: 2px solid #f2f2f2;
        }

        .profile-image-wrapper:hover {
            border-color: #ffb4aa;
        }

        .profile-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .default-profile {
            font-size: 50px;
        }

        .profile-input {
            display: none;
        }

        .photo-change-button {
            display: inline-block;

            padding: 8px 18px;

            background: white;
            border: 1px solid #ddd;
            border-radius: 18px;

            color: #555;
            font-size: 13px;

            cursor: pointer;
        }

        .photo-change-button:hover {
            background: #f7f7f7;
        }

        .photo-help {
            margin-top: 8px;

            color: #aaa;
            font-size: 11px;
        }

        /* ==============================
           입력
        ============================== */

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;

            margin-bottom: 8px;

            font-size: 14px;
            font-weight: bold;
        }

        .text-input {
            width: 100%;
            height: 48px;

            padding: 0 14px;

            border: 1px solid #ddd;
            border-radius: 10px;

            font-size: 15px;
            outline: none;

            transition: 0.2s;
        }

        .text-input:focus {
            border-color: #ff8b7b;

            box-shadow:
                0 0 0 3px rgba(255, 139, 123, 0.12);
        }

        .readonly {
            background: #f5f5f5;
            color: #999;
            cursor: not-allowed;
        }

        .help-text {
            margin-top: 6px;

            color: #999;
            font-size: 12px;
        }

        /* ==============================
           저장 버튼
        ============================== */

        .save-button {
            width: 100%;
            height: 50px;

            margin-top: 10px;

            border: none;
            border-radius: 12px;

            background: #ff8b7b;
            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
            transition: 0.2s;
        }

        .save-button:hover {
            background: #f77b6b;
        }

        .cancel-button {
            display: block;

            margin-top: 15px;

            text-align: center;

            color: #999;
            font-size: 13px;

            text-decoration: none;
        }

        .cancel-button:hover {
            color: #666;
        }
    </style>
<style>

/* PinkSole - My Trips visual system; existing Flask bindings and behaviors unchanged */
:root{--ps-primary:#00CBD7;--ps-orange:#FF8800;--ps-mint:#E8F8F9;--ps-ink:#142739;--ps-muted:#82909D;--ps-line:#E4EBEE;--ps-shadow:0 5px 18px rgba(31,67,82,.045)}
body{background:#F5F7F8!important;color:var(--ps-ink)!important;font-family:'Pretendard','Noto Sans KR','Apple SD Gothic Neo',Arial,sans-serif!important}
a,button,input{ -webkit-tap-highlight-color:transparent }
a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid var(--ps-primary)!important;outline-offset:3px}

.page{display:block!important;min-height:100vh!important;max-width:460px!important;margin:0 auto!important;padding:24px 24px 110px!important;background:#fff!important}
.edit-container{width:100%!important;max-width:none!important;border-radius:0!important;padding:0!important;box-shadow:none!important;background:transparent!important}
.top{display:flex!important;align-items:center!important;justify-content:space-between!important;text-align:center!important;position:relative!important;margin-bottom:35px!important;min-height:34px!important}
.back-button{position:static!important;flex:none!important;font-size:22px!important;color:var(--ps-ink)!important;text-decoration:none!important;width:32px!important;overflow:hidden!important;white-space:nowrap!important}
.top h1{margin:0!important;font-size:16px!important;font-weight:800!important;color:var(--ps-ink)!important}
.top .description{display:none!important}
.ps-brand{font-size:11px;font-weight:900;color:var(--ps-orange);letter-spacing:.04em}
.ps-intro{margin:0 0 27px}
.ps-eyebrow{font-size:11px;color:var(--ps-orange);font-weight:900;letter-spacing:.12em;margin:0 0 10px}
.ps-intro h2{font-size:27px;line-height:1.35;letter-spacing:-.05em;font-weight:800;margin:0 0 10px;color:var(--ps-ink)}
.ps-intro p{font-size:13px;line-height:1.7;color:var(--ps-muted);margin:0}
.profile-area{padding:22px 15px 19px!important;border:1px solid var(--ps-line)!important;border-radius:23px!important;margin-bottom:27px!important;background:#fff!important;box-shadow:var(--ps-shadow)!important}
.profile-image-wrapper{background:var(--ps-mint)!important;border:2px solid #D2EEF0!important;width:102px!important;height:102px!important}
.profile-image-wrapper:hover{border-color:var(--ps-primary)!important}
.photo-change-button{border:1px solid #A5E7EB!important;border-radius:13px!important;background:var(--ps-mint)!important;color:#23727B!important;font-weight:800!important;padding:10px 19px!important}
.form-group{margin-bottom:21px!important}
.form-label{font-size:13px!important;font-weight:800!important;color:var(--ps-ink)!important}
.text-input{height:51px!important;border:1px solid var(--ps-line)!important;border-radius:14px!important;background:#fff!important;color:var(--ps-ink)!important;font-family:inherit!important}
.text-input:focus{border-color:var(--ps-primary)!important;box-shadow:0 0 0 3px rgba(0,203,215,.13)!important}
.text-input.readonly{background:#F5F8F9!important;color:#82909D!important}
.help-text,.photo-help{color:var(--ps-muted)!important}
.save-button{height:56px!important;margin-top:17px!important;background:var(--ps-primary)!important;color:white!important;border-radius:17px!important;font-size:16px!important;box-shadow:0 7px 17px rgba(0,203,215,.13)!important}
.save-button:hover{background:#00B9C5!important}
.cancel-button{padding:11px!important;font-size:13px!important;color:#728591!important}
@media(max-width:360px){.page{padding-left:17px!important;padding-right:17px!important}}

</style>
</head>


<body>

<div class="page">

    <div class="edit-container">

        <!-- ==============================
             상단
        ============================== -->

        <div class="top">

            <a
                href="/mypage"
                class="back-button"
            >
                ← 뒤로
            </a>

            <h1>
                프로필 수정
            </h1>
            <span class="ps-brand">PINKSOLE</span>

            <p class="description">
                내 정보를 수정할 수 있습니다.
            </p>

        </div>


        <section class="ps-intro"><div class="ps-eyebrow">EDIT PROFILE</div><h2>내 정보 수정하기</h2><p>프로필 사진과 닉네임, 이메일을 관리해 보세요.</p></section>

        <!-- ==============================
             수정 폼
        ============================== -->

        <form
            method="POST"
            action="/mypage/edit"
            enctype="multipart/form-data"
            id="profileForm"
        >


            <!-- ==============================
                 프로필 사진
            ============================== -->

            <div class="profile-area">

                <!--
                    이 label을 클릭하면
                    아래의 숨겨진 file input이 실행됨
                -->
                <label
                    for="profileImageInput"
                    class="profile-image-wrapper"
                >

                    {% if user.profile_image %}

                        <img
                            src="{{ user.profile_image }}"
                            alt="프로필 사진"
                            id="profilePreview"
                            class="profile-image"
                        >

                        <div
                            id="defaultProfile"
                            class="default-profile"
                            style="display: none;"
                        >
                            🐶
                        </div>

                    {% else %}

                        <img
                            src=""
                            alt="프로필 사진"
                            id="profilePreview"
                            class="profile-image"
                            style="display: none;"
                        >

                        <div
                            id="defaultProfile"
                            class="default-profile"
                        >
                            🐶
                        </div>

                    {% endif %}

                </label>


                <!-- 실제 파일 선택 input -->
                <input
                    type="file"
                    id="profileImageInput"
                    name="profile_image"
                    class="profile-input"
                    accept=".jpg,.jpeg,.png,.webp,image/jpeg,image/png,image/webp"
                >


                <!-- 사진 변경 버튼 -->
                <label
                    for="profileImageInput"
                    class="photo-change-button"
                >
                    사진 변경
                </label>

            </div>


            <!-- ==============================
                 아이디
            ============================== -->

            <div class="form-group">

                <label
                    for="username"
                    class="form-label"
                >
                    아이디
                </label>

                <input
                    type="text"
                    id="username"
                    class="text-input readonly"
                    value="{{ user.username }}"
                    readonly
                >

                <div class="help-text">
                    아이디는 변경할 수 없습니다.
                </div>

            </div>


            <!-- ==============================
                 닉네임
            ============================== -->

            <div class="form-group">

                <label
                    for="nickname"
                    class="form-label"
                >
                    닉네임
                </label>

                <input
                    type="text"
                    id="nickname"
                    name="nickname"
                    class="text-input"
                    value="{{ user.nickname }}"
                    maxlength="50"
                    required
                >

            </div>


            <!-- ==============================
                 이메일
            ============================== -->

            <div class="form-group">

                <label
                    for="email"
                    class="form-label"
                >
                    이메일
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    class="text-input"
                    value="{{ user.email }}"
                    required
                >

            </div>


            <!-- ==============================
                 저장
            ============================== -->

            <button
                type="submit"
                class="save-button"
            >
                저장하기
            </button>

        </form>


        <a
            href="/mypage"
            class="cancel-button"
        >
            취소
        </a>

    </div>

</div>


<script>
    const profileImageInput =
        document.getElementById("profileImageInput");

    const profilePreview =
        document.getElementById("profilePreview");

    const defaultProfile =
        document.getElementById("defaultProfile");


    profileImageInput.addEventListener(
        "change",
        function(event) {

            const file =
                event.target.files[0];


            // 파일을 선택하지 않은 경우
            if (!file) {
                return;
            }


            // 이미지 파일인지 확인
            if (!file.type.startsWith("image/")) {

                alert(
                    "이미지 파일을 선택해주세요."
                );

                profileImageInput.value = "";

                return;
            }


            // 선택한 사진을 브라우저에서 읽음
            const reader =
                new FileReader();


            reader.onload =
                function(event) {

                    profilePreview.src =
                        event.target.result;

                    profilePreview.style.display =
                        "block";

                    defaultProfile.style.display =
                        "none";
                };


            reader.readAsDataURL(file);
        }
    );
</script>

</body>

</html>
