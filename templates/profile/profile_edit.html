<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>프로필 수정 | 반려견 제주 여행</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f7f8fa;
            color: #333;
        }

        .page {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .edit-container {
            width: 100%;
            max-width: 440px;

            background: white;
            border-radius: 20px;
            padding: 38px 34px;

            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        /* ==============================
           상단
        ============================== */

        .top {
            position: relative;
            text-align: center;
            margin-bottom: 30px;
        }

        .back-button {
            position: absolute;
            left: 0;
            top: 3px;

            color: #777;
            text-decoration: none;
            font-size: 14px;
        }

        .back-button:hover {
            color: #333;
        }

        h1 {
            margin: 0;
            font-size: 24px;
        }

        .description {
            margin: 9px 0 0;
            color: #888;
            font-size: 13px;
        }

        /* ==============================
           프로필 사진
        ============================== */

        .profile-area {
            text-align: center;
            margin-bottom: 30px;
        }

        .profile-image-wrapper {
            position: relative;

            width: 110px;
            height: 110px;

            margin: 0 auto 13px;

            border-radius: 50%;
            background: #fff1ee;

            overflow: hidden;

            display: flex;
            align-items: center;
            justify-content: center;

            cursor: pointer;

            border: 2px solid #f2f2f2;
        }

        .profile-image-wrapper:hover {
            border-color: #ffb4aa;
        }

        .profile-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .default-profile {
            font-size: 50px;
        }

        .profile-input {
            display: none;
        }

        .photo-change-button {
            display: inline-block;

            padding: 8px 18px;

            background: white;
            border: 1px solid #ddd;
            border-radius: 18px;

            color: #555;
            font-size: 13px;

            cursor: pointer;
        }

        .photo-change-button:hover {
            background: #f7f7f7;
        }

        .photo-help {
            margin-top: 8px;

            color: #aaa;
            font-size: 11px;
        }

        /* ==============================
           입력
        ============================== */

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;

            margin-bottom: 8px;

            font-size: 14px;
            font-weight: bold;
        }

        .text-input {
            width: 100%;
            height: 48px;

            padding: 0 14px;

            border: 1px solid #ddd;
            border-radius: 10px;

            font-size: 15px;
            outline: none;

            transition: 0.2s;
        }

        .text-input:focus {
            border-color: #ff8b7b;

            box-shadow:
                0 0 0 3px rgba(255, 139, 123, 0.12);
        }

        .readonly {
            background: #f5f5f5;
            color: #999;
            cursor: not-allowed;
        }

        .help-text {
            margin-top: 6px;

            color: #999;
            font-size: 12px;
        }

        /* ==============================
           저장 버튼
        ============================== */

        .save-button {
            width: 100%;
            height: 50px;

            margin-top: 10px;

            border: none;
            border-radius: 12px;

            background: #ff8b7b;
            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
            transition: 0.2s;
        }

        .save-button:hover {
            background: #f77b6b;
        }

        .cancel-button {
            display: block;

            margin-top: 15px;

            text-align: center;

            color: #999;
            font-size: 13px;

            text-decoration: none;
        }

        .cancel-button:hover {
            color: #666;
        }
    </style>
</head>


<body>

<div class="page">

    <div class="edit-container">

        <!-- ==============================
             상단
        ============================== -->

        <div class="top">

            <a
                href="/mypage"
                class="back-button"
            >
                ← 뒤로
            </a>

            <h1>
                프로필 수정
            </h1>

            <p class="description">
                내 정보를 수정할 수 있습니다.
            </p>

        </div>


        <!-- ==============================
             수정 폼
        ============================== -->

        <form
            method="POST"
            action="/mypage/edit"
            enctype="multipart/form-data"
            id="profileForm"
        >


            <!-- ==============================
                 프로필 사진
            ============================== -->

            <div class="profile-area">

                <!--
                    이 label을 클릭하면
                    아래의 숨겨진 file input이 실행됨
                -->
                <label
                    for="profileImageInput"
                    class="profile-image-wrapper"
                >

                    {% if user.profile_image %}

                        <img
                            src="{{ user.profile_image }}"
                            alt="프로필 사진"
                            id="profilePreview"
                            class="profile-image"
                        >

                        <div
                            id="defaultProfile"
                            class="default-profile"
                            style="display: none;"
                        >
                            🐶
                        </div>

                    {% else %}

                        <img
                            src=""
                            alt="프로필 사진"
                            id="profilePreview"
                            class="profile-image"
                            style="display: none;"
                        >

                        <div
                            id="defaultProfile"
                            class="default-profile"
                        >
                            🐶
                        </div>

                    {% endif %}

                </label>


                <!-- 실제 파일 선택 input -->
                <input
                    type="file"
                    id="profileImageInput"
                    name="profile_image"
                    class="profile-input"
                    accept=".jpg,.jpeg,.png,.webp,image/jpeg,image/png,image/webp"
                >


                <!-- 사진 변경 버튼 -->
                <label
                    for="profileImageInput"
                    class="photo-change-button"
                >
                    사진 변경
                </label>

            </div>


            <!-- ==============================
                 아이디
            ============================== -->

            <div class="form-group">

                <label
                    for="username"
                    class="form-label"
                >
                    아이디
                </label>

                <input
                    type="text"
                    id="username"
                    class="text-input readonly"
                    value="{{ user.username }}"
                    readonly
                >

                <div class="help-text">
                    아이디는 변경할 수 없습니다.
                </div>

            </div>


            <!-- ==============================
                 닉네임
            ============================== -->

            <div class="form-group">

                <label
                    for="nickname"
                    class="form-label"
                >
                    닉네임
                </label>

                <input
                    type="text"
                    id="nickname"
                    name="nickname"
                    class="text-input"
                    value="{{ user.nickname }}"
                    maxlength="50"
                    required
                >

            </div>


            <!-- ==============================
                 이메일
            ============================== -->

            <div class="form-group">

                <label
                    for="email"
                    class="form-label"
                >
                    이메일
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    class="text-input"
                    value="{{ user.email }}"
                    required
                >

            </div>


            <!-- ==============================
                 저장
            ============================== -->

            <button
                type="submit"
                class="save-button"
            >
                저장하기
            </button>

        </form>


        <a
            href="/mypage"
            class="cancel-button"
        >
            취소
        </a>

    </div>

</div>


<script>
    const profileImageInput =
        document.getElementById("profileImageInput");

    const profilePreview =
        document.getElementById("profilePreview");

    const defaultProfile =
        document.getElementById("defaultProfile");


    profileImageInput.addEventListener(
        "change",
        function(event) {

            const file =
                event.target.files[0];


            // 파일을 선택하지 않은 경우
            if (!file) {
                return;
            }


            // 이미지 파일인지 확인
            if (!file.type.startsWith("image/")) {

                alert(
                    "이미지 파일을 선택해주세요."
                );

                profileImageInput.value = "";

                return;
            }


            // 선택한 사진을 브라우저에서 읽음
            const reader =
                new FileReader();


            reader.onload =
                function(event) {

                    profilePreview.src =
                        event.target.result;

                    profilePreview.style.display =
                        "block";

                    defaultProfile.style.display =
                        "none";
                };


            reader.readAsDataURL(file);
        }
    );
</script>

</body>

</html>
