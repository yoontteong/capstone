<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>회원가입</title>
</head>

<body>

    <h2>회원가입</h2>

    <form method="POST" action="/register">

        <div>
            <label for="username">아이디</label>
            <input
                type="text"
                id="username"
                name="username"
                required
            >
        </div>

        <div>
            <label for="password">비밀번호</label>
            <input
                type="password"
                id="password"
                name="password"
                required
            >
        </div>

        <div>
            <label for="nickname">닉네임</label>
            <input
                type="text"
                id="nickname"
                name="nickname"
                required
            >
        </div>

        <button type="submit">
            회원가입
        </button>

    </form>

    <a href="/">
        메인으로 돌아가기
    </a>

</body>
</html>
