<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>로그인</title>
</head>

<body>

    <h2>로그인</h2>

    <form method="POST" action="/login">

        <div>
            <label for="username">아이디</label>
            <input
                type="text"
                id="username"
                name="username"
                required
            >
        </div>

        <div>
            <label for="password">비밀번호</label>
            <input
                type="password"
                id="password"
                name="password"
                required
            >
        </div>

        <button type="submit">
            로그인
        </button>

    </form>

    <p>
        계정이 없으신가요?
        <a href="/register">회원가입</a>
    </p>

    <a href="/">메인으로 돌아가기</a>

</body>
</html>
