<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>로그인 | 반려견 제주 여행</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f7f8fa;
            color: #333;
        }

        .page {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .login-container {
            width: 100%;
            max-width: 440px;
            background: white;
            border-radius: 20px;
            padding: 38px 34px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        .logo {
            text-align: center;
            font-size: 42px;
            margin-bottom: 10px;
        }

        h1 {
            margin: 0;
            text-align: center;
            font-size: 26px;
        }

        .description {
            margin: 10px 0 32px;
            text-align: center;
            color: #777;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: bold;
        }

        input {
            width: 100%;
            height: 48px;
            padding: 0 14px;

            border: 1px solid #ddd;
            border-radius: 10px;

            font-size: 15px;
            outline: none;

            transition: 0.2s;
        }

        input:focus {
            border-color: #ff8b7b;
            box-shadow: 0 0 0 3px rgba(255, 139, 123, 0.12);
        }

        .login-button {
            width: 100%;
            height: 50px;

            margin-top: 10px;

            border: none;
            border-radius: 12px;

            background: #ff8b7b;
            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }

        .login-button:hover {
            background: #f77b6b;
        }

        .register-area {
            margin-top: 24px;
            text-align: center;
            font-size: 14px;
            color: #777;
        }

        .register-area a {
            margin-left: 5px;
            color: #ff7968;
            font-weight: bold;
            text-decoration: none;
        }

        .register-area a:hover {
            text-decoration: underline;
        }

        .back {
            display: block;
            margin-top: 18px;
            text-align: center;
            color: #999;
            font-size: 13px;
            text-decoration: none;
        }

        .back:hover {
            color: #666;
        }

    </style>
</head>


<body>

<div class="page">

    <div class="login-container">

        <!-- 로고 -->
        <div class="logo">
            🐾
        </div>


        <!-- 제목 -->
        <h1>
            로그인
        </h1>


        <p class="description">
            반려견과 함께하는 제주 여행을 시작해보세요.
        </p>


        <!-- 로그인 폼 -->
        <form
            method="POST"
            action="/login"
        >

            <!-- 아이디 -->
            <div class="form-group">

                <label for="username">
                    아이디
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="아이디를 입력해주세요"
                    autocomplete="username"
                    required
                >

            </div>


            <!-- 비밀번호 -->
            <div class="form-group">

                <label for="password">
                    비밀번호
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="비밀번호를 입력해주세요"
                    autocomplete="current-password"
                    required
                >

            </div>


            <!-- 로그인 버튼 -->
            <button
                type="submit"
                class="login-button"
            >
                로그인
            </button>

        </form>


        <!-- 회원가입 -->
        <div class="register-area">

            아직 계정이 없으신가요?

            <a href="/register">
                회원가입
            </a>

        </div>


        <!-- 메인 -->
        <a
            href="/"
            class="back"
        >
            메인으로 돌아가기
        </a>

    </div>

</div>

</body>
</html>
