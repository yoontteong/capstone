<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>활동 기록 | PINKSOLE</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
<link rel="stylesheet" href="{{ url_for('static', filename='css/bottomnav.css') }}">
<style>
:root{--primary:#49B9BF;--dark:#FF9808;--soft:#E7F7F7;--ink:#202B33;--muted:#74858D;--line:#E7EEF0}
*{box-sizing:border-box}
body{margin:0;background:#F3F6F7;color:var(--ink);font-family:'Pretendard','Noto Sans KR',Arial,sans-serif}
.app{max-width:460px;min-height:100vh;margin:auto;padding:24px 20px 120px;background:#fff}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px}
.topbar a{color:var(--ink);text-decoration:none;font-size:21px}
.topbar strong{font-size:16px}.brand{color:var(--dark);font-weight:900;font-size:11px}
.eyebrow{color:var(--dark);font-size:11px;letter-spacing:.11em;font-weight:900;margin-bottom:7px}
h1{font-size:27px;letter-spacing:-.05em;margin:0 0 8px}
.description{color:var(--muted);font-size:13px;line-height:1.65;margin:0 0 25px}
.dog-picker{display:flex;align-items:center;gap:12px;border:1px solid var(--line);padding:13px 15px;border-radius:18px;margin-bottom:22px;background:#FAFCFC}
.dog-avatar{display:grid;place-items:center;background:var(--soft);width:45px;height:45px;border-radius:14px;font-size:22px;flex-shrink:0}
.dog-field{min-width:0;flex:1}.dog-field label{display:block;color:var(--muted);font-size:11px;margin-bottom:5px}
#dog-select{border:0;background:transparent;width:100%;font-weight:700;color:var(--ink);font-size:14px;padding:3px 0}
.distance-panel{background:linear-gradient(145deg,#E7F7F7,#F5FBFB);border:1px solid #D7EDED;border-radius:23px;padding:23px 20px 20px;margin-bottom:15px;text-align:center}
.distance-caption{font-size:12px;color:#577B81;font-weight:700;margin:0 0 12px}
.distance-number{font-size:55px;font-weight:850;line-height:1;letter-spacing:-.07em;color:#1F4146;font-variant-numeric:tabular-nums}
.distance-unit{font-size:15px;color:#577B81;margin-left:5px;font-weight:700}
.summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0 0}
.summary-card{border-radius:15px;background:white;padding:14px 8px;border:1px solid #DEEFEF}
.summary-value{font-size:18px;font-weight:850;font-variant-numeric:tabular-nums;white-space:nowrap}
.summary-label{font-size:11px;color:var(--muted);margin-top:6px}
#status{background:#F4F7F8;border-radius:12px;text-align:center;font-size:12px;font-weight:700;color:#65777E;padding:12px;margin-bottom:14px}
.map-heading{display:flex;justify-content:space-between;align-items:center;margin:25px 0 12px}
.map-heading h2{margin:0;font-size:17px}.map-heading span{font-size:11px;color:var(--muted)}
#map{height:340px;width:100%;border-radius:20px;overflow:hidden;border:1px solid var(--line);z-index:1}
button{font-family:inherit;cursor:pointer}
.main-action{margin-top:18px;width:100%;border:0;border-radius:17px;background:var(--primary);color:#153A3E;padding:17px;font-size:16px;font-weight:850;box-shadow:0 5px 14px rgba(73,185,191,.18)}
.main-action.recording{background:#FFF0EE;color:#A7423C;box-shadow:none;border:1px solid #F5CFCC}
#saveBtn{margin-top:10px;width:100%;border:1px solid #B7DEDF;border-radius:17px;background:#F3FAFA;color:var(--dark);padding:15px;font-size:14px;font-weight:800}
#saveBtn:disabled{display:none}
.logic-only{display:none!important}
.secondary-actions{display:flex;justify-content:space-between;align-items:center;margin:22px 2px 0;gap:12px}
.history-btn{text-decoration:none;color:var(--dark);font-size:13px;font-weight:750}
.tools{margin-top:20px;border-top:1px solid var(--line);padding-top:16px}
.tools summary{cursor:pointer;list-style:none;color:var(--muted);font-size:12px;display:flex;justify-content:space-between}
.tools summary::-webkit-details-marker{display:none}
.tools summary::after{content:'⌄';font-size:17px}
.tools[open] summary::after{content:'⌃'}
.test-btn{margin-top:12px;width:100%;border:1px solid var(--line);background:white;border-radius:12px;color:#65777E;padding:12px;font-size:13px;font-weight:700}
#secure-check{display:none}.distance-marker{background:white;border:2px solid var(--primary);padding:3px 8px;border-radius:20px;font-size:11px;font-weight:800;white-space:nowrap}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
@media(max-width:360px){.app{padding-left:16px;padding-right:16px}.distance-number{font-size:48px}}
</style>

<style>

/* 여행 카드처럼 흰 바탕, 얇은 테두리, 부드러운 그림자 */

.app .checklist-card .progress,.app .progress {background:#E8F8F9!important;color:#187D86!important;border-radius:12px!important;}

/* 내 여행의 '새 여행 만들기'와 같은 선명한 청록색 CTA */

}

  background:#E8F8F9!important;color:#157E87!important;border:1px solid #CDEDEF!important;

}
.app .delete,.app .delete-btn {background:#FFF1F1!important;color:#C25858!important;border:1px solid #F6DDDD!important;box-shadow:none!important;}
.app .history-btn:not(.button),.app .card-footer,.app .score-row strong {color:#FF8800!important;}
.app input:not([type=checkbox]):not([type=radio]),.app select,.app textarea {

}

<body>
<div class="app">
<header class="topbar"><a href="/" aria-label="뒤로가기">←</a><strong>활동 기록</strong><span class="brand">PINKSOLE</span></header>
<div class="eyebrow">ACTIVITY TRACKER</div>
<h1>함께 걷는 시간</h1>
<p class="description">반려견과 걸은 거리와 시간을 기록해 보세요.</p>
<p id="secure-check"></p>
<section class="dog-picker">
<div class="dog-avatar">🐾</div>
<div class="dog-field"><label for="dog-select">활동할 반려견</label><select id="dog-select">{% for dog in dogs %}<option value="{{ dog.id }}">{{ dog.name }}{% if dog.breed %} · {{ dog.breed }}{% endif %}</option>{% endfor %}</select></div>
</section>
<section class="distance-panel" aria-label="활동 요약">
<p class="distance-caption">총 이동 거리</p>
<div><span id="distance" class="distance-number">0.00</span><span class="distance-unit">km</span></div>
<div class="summary-grid">
<div class="summary-card"><div class="summary-value" id="time">0분 0초</div><div class="summary-label">활동 시간</div></div>
<div class="summary-card"><div class="summary-value" id="speed">0.0 km/h</div><div class="summary-label">평균 속도</div></div>
</div>
</section>
<div id="status" role="status" aria-live="polite">기록 대기 중</div>
<div class="map-heading"><h2>이동 경로</h2><span>GPS 기반 실시간 기록</span></div>
<div id="map" aria-label="활동 경로 지도"></div>
<!-- 기존 로직이 상태를 갱신하는 요소 (화면에는 보이지 않음) -->
<button type="button" id="startBtn" class="logic-only" onclick="startTracking()">기록 시작</button>
<button type="button" id="stopBtn" class="logic-only" onclick="stopTracking()" disabled>기록 종료</button>
<!-- 실사용 버튼은 하나만 보여줌 -->
<button type="button" id="mainTrackBtn" class="main-action" onclick="toggleTracking()">● 활동 기록 시작</button>
<button type="button" id="saveBtn" onclick="saveActivity()" disabled>활동 기록 저장하기</button>
<div class="secondary-actions"><a href="/activity/history" class="history-btn">지난 활동 기록 보기 →</a></div>
<details class="tools"><summary>위치 확인 및 테스트</summary><button type="button" class="test-btn" onclick="testGPS()">GPS 연결 테스트</button></details>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script>
/* =========================================
   보안 환경 확인
========================================= */

document.getElementById(
    "secure-check"
).innerText =
    "보안 환경 여부: "
    + window.isSecureContext;


/* =========================================
   활동 기록 변수
========================================= */

let timerInterval = null;
let watchId = null;

let isTracking = false;

let positions = [];

let totalDistance = 0;

let startTime = null;


/* =========================================
   지도 변수
========================================= */

let map = null;

let routeLine = null;

let startMarker = null;

let currentMarker = null;

let endMarker = null;

let distanceMarkers = [];

let nextDistanceMarker = 1;

let finalDurationSeconds = 0;


/* =========================================
   지도 초기화
========================================= */

function initMap() {

    map = L.map(
        "map",
        {
            zoomControl: true
        }
    ).setView(
        [33.3617, 126.5292],
        10
    );


    L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
            maxZoom: 19,
            attribution: "OpenStreetMap"
        }
    ).addTo(map);

}


/* =========================================
   지도 기록 초기화
========================================= */

function resetMap() {

    if (!map) {
        return;
    }


    if (routeLine) {

        map.removeLayer(
            routeLine
        );

        routeLine = null;

    }


    if (startMarker) {

        map.removeLayer(
            startMarker
        );

        startMarker = null;

    }


    if (currentMarker) {

        map.removeLayer(
            currentMarker
        );

        currentMarker = null;

    }


    if (endMarker) {

        map.removeLayer(
            endMarker
        );

        endMarker = null;

    }


    distanceMarkers.forEach(
        marker => {

            map.removeLayer(
                marker
            );

        }
    );


    distanceMarkers = [];

    nextDistanceMarker = 1;


    map.setView(
        [33.3617, 126.5292],
        10
    );

}


/* =========================================
   활동 기록 시작
========================================= */

function startTracking() {

    if (!navigator.geolocation) {

        alert(
            "GPS를 지원하지 않는 브라우저입니다."
        );

        return;
    }


    if (isTracking) {
        return;
    }


    isTracking = true;

    positions = [];

    totalDistance = 0;

    startTime = new Date();


    resetMap();


    document.getElementById(
        "distance"
    ).innerText =
        "0.00";


    document.getElementById(
        "time"
    ).innerText =
        "0분 0초";


    document.getElementById(
        "speed"
    ).innerText =
        "0.0 km/h";


    document.getElementById(
        "status"
    ).innerText =
        "🟢 활동 기록 중...";


    document.getElementById(
        "startBtn"
    ).disabled =
        true;


    document.getElementById(
        "stopBtn"
    ).disabled =
        false;


    /* 활동 시간 갱신 */

    timerInterval =
        setInterval(
            updateTimer,
            1000
        );


    /* GPS 위치 추적 */

    watchId =
        navigator.geolocation
        .watchPosition(

            updatePosition,

            errorPosition,

            {
                enableHighAccuracy:
                    true,

                maximumAge:
                    0,

                timeout:
                    15000
            }

        );


    alert(
        "활동 기록 시작"
    );

}


/* =========================================
   활동시간 + 평균속도 계산
========================================= */

function updateTimer() {

    if (!isTracking) {
        return;
    }


    const now =
        new Date();


    const totalSeconds =
        Math.floor(
            (now - startTime)
            / 1000
        );


    const minutes =
        Math.floor(
            totalSeconds / 60
        );


    const seconds =
        totalSeconds % 60;


    document.getElementById(
        "time"
    ).innerText =
        minutes
        + "분 "
        + seconds
        + "초";


    const hours =
        totalSeconds / 3600;


    let averageSpeed =
        0;


    if (
        hours > 0
    ) {

        averageSpeed =
            totalDistance
            / hours;

    }


    document.getElementById(
        "speed"
    ).innerText =
        averageSpeed
        .toFixed(1)
        + " km/h";

}


/* =========================================
   GPS 위치 업데이트
========================================= */

function updatePosition(
    position
) {

    if (!isTracking) {
        return;
    }


    const accuracy =
        position.coords.accuracy;


    const gpsSpeed =
        position.coords.speed;


    /*
        정확도가 25m보다 나쁘면 무시

        실내나 건물 주변에서
        크게 튀는 좌표 방지
    */

    if (
        accuracy > 25
    ) {

        console.log(
            "GPS 정확도 낮음:",
            accuracy
        );

        return;
    }


    const lat =
        position.coords.latitude;


    const lng =
        position.coords.longitude;


    const current = {

        lat: lat,
        lng: lng,
        time: Date.now()

    };


    /* =====================================
       첫 위치
    ===================================== */

    if (
        positions.length === 0
    ) {

        positions.push(
            current
        );


        /*
            첫 GPS 위치로 확대
        */

        map.setView(
            [lat, lng],
            18
        );


        /*
            출발점
        */

        startMarker =
            L.circleMarker(
                [lat, lng],
                {
                    radius: 8,

                    color:
                        "#278D95",

                    fillColor:
                        "#49B9BF",

                    fillOpacity:
                        1,

                    weight:
                        3
                }
            )
            .addTo(map)
            .bindTooltip(
                "출발"
            );


        /*
            현재 위치
        */

        currentMarker =
            L.circleMarker(
                [lat, lng],
                {
                    radius: 7,

                    color:
                        "#1565c0",

                    fillColor:
                        "#2196f3",

                    fillOpacity:
                        1,

                    weight:
                        3
                }
            )
            .addTo(map);


        return;

    }


    /* =====================================
       이전 위치와 현재 위치 거리 계산
    ===================================== */

    const prev =
        positions[
            positions.length - 1
        ];


    const distance =
        calculateDistance(

            prev.lat,
            prev.lng,

            current.lat,
            current.lng

        );


    /*
        3m 미만 움직임은
        GPS 흔들림으로 판단
    */

    if (
        distance < 0.003
    ) {

        return;
    }


    /*
        한번에 30m 이상 이동했다면
        GPS 순간 튐으로 판단

        걷기 기록에 맞춘 기준
    */

    if (
        distance >= 0.03
    ) {

        console.log(
            "GPS 순간 튐 제거:",
            distance,
            "km"
        );

        return;
    }


    /*
        스마트폰 GPS가 속도값을 제공하고
        시속 15km 이상이라면
        걷기/산책 기록으로 비정상 판단
    */

    if (
        gpsSpeed !== null
        && gpsSpeed >= 0
        && gpsSpeed * 3.6 > 15
    ) {

        console.log(
            "비정상 GPS 속도 제거:",
            gpsSpeed * 3.6,
            "km/h"
        );

        return;
    }


    /*
        이전 정상 GPS와 시간 차이 계산
    */

    const elapsedSeconds =
        (
            current.time
            - prev.time
        )
        / 1000;


    /*
        시간 기준으로 계산한 구간 속도

        예:
        GPS 자체 speed 값이 없더라도
        실제 좌표 이동속도로 추가 검증
    */

    if (
        elapsedSeconds > 0
    ) {

        const calculatedSpeed =
            distance
            /
            (
                elapsedSeconds
                / 3600
            );


        /*
            좌표상 계산된 속도가
            15km/h 이상이면 무시
        */

        if (
            calculatedSpeed > 15
        ) {

            console.log(
                "계산 속도 이상:",
                calculatedSpeed
            );

            return;
        }

    }


    /* =====================================
       정상 GPS 좌표로 인정
    ===================================== */

    totalDistance +=
        distance;


    positions.push(
        current
    );


    document.getElementById(
        "distance"
    ).innerText =
        totalDistance
        .toFixed(2);


    updateRoute();


    updateCurrentMarker(
        lat,
        lng
    );


    addDistanceMarkerIfNeeded(
        lat,
        lng
    );


    /*
        현재 위치를 따라감
    */

    map.panTo(
        [lat, lng]
    );

}


/* =========================================
   이동 경로 그리기
========================================= */

function updateRoute() {

    if (
        positions.length < 2
    ) {

        return;
    }


    const routePoints =
        positions.map(
            pos => [

                pos.lat,
                pos.lng

            ]
        );


    if (
        routeLine
    ) {

        map.removeLayer(
            routeLine
        );

    }


    routeLine =
        L.polyline(
            routePoints,
            {
                color:
                    "#49B9BF",

                weight:
                    6,

                opacity:
                    0.9,

                lineJoin:
                    "round",

                lineCap:
                    "round"
            }
        )
        .addTo(map);

}


/* =========================================
   현재 위치 마커 이동
========================================= */

function updateCurrentMarker(
    lat,
    lng
) {

    if (
        !currentMarker
    ) {

        return;
    }


    currentMarker
        .setLatLng(
            [lat, lng]
        );

}


/* =========================================
   거리 마커

   1km마다 생성
========================================= */

function addDistanceMarkerIfNeeded(
    lat,
    lng
) {

    /*
        한 번에 여러 km 기준점을
        넘어갈 가능성까지 처리
    */

    while (
        totalDistance
        >= nextDistanceMarker
    ) {

        const distanceIcon =
            L.divIcon({

                className:
                    "distance-marker",

                html:
                    nextDistanceMarker
                    + " km",

                iconSize:
                    null

            });


        const marker =
            L.marker(
                [lat, lng],
                {
                    icon:
                        distanceIcon
                }
            )
            .addTo(map);


        distanceMarkers.push(
            marker
        );


        nextDistanceMarker +=
            1;

    }

}


/* =========================================
   활동 기록 종료
========================================= */

function stopTracking() {

    if (!isTracking) {
        return;
    }

    // 최종 활동 시간 저장
    finalDurationSeconds =
        Math.floor(
            (new Date() - startTime) / 1000
        );

    isTracking = false;


    /*
        GPS 추적 종료
    */

    if (
        watchId !== null
    ) {

        navigator.geolocation
            .clearWatch(
                watchId
            );

        watchId =
            null;

    }


    /*
        타이머 종료
    */

    if (
        timerInterval !== null
    ) {

        clearInterval(
            timerInterval
        );

        timerInterval =
            null;

    }


    /*
        현재 위치 파란 점 제거
    */

    if (
        currentMarker
    ) {

        map.removeLayer(
            currentMarker
        );

        currentMarker =
            null;

    }


    /*
        종료점 생성
    */

    if (
        positions.length > 0
    ) {

        const last =
            positions[
                positions.length - 1
            ];


        endMarker =
            L.circleMarker(
                [
                    last.lat,
                    last.lng
                ],
                {
                    radius:
                        8,

                    color:
                        "#b71c1c",

                    fillColor:
                        "#f44336",

                    fillOpacity:
                        1,

                    weight:
                        3
                }
            )
            .addTo(map)
            .bindTooltip(
                "종료"
            );

    }


    document.getElementById(
        "status"
    ).innerText =
        "🔴 활동 기록 종료";


    document.getElementById(
        "startBtn"
    ).disabled =
        false;


    document.getElementById(
        "stopBtn"
    ).disabled =
        true;
    
    document.getElementById(
        "saveBtn"
    ).disabled =
        positions.length === 0;    


    /*
        마지막 평균 속도도 한 번 계산
    */

    updateFinalSpeed();


    /*
        전체 경로가 보이도록
        지도 확대/축소
    */

    if (
        routeLine
        && positions.length > 1
    ) {

        map.fitBounds(
            routeLine.getBounds(),
            {
                padding:
                    [30, 30]
            }
        );

    }


    alert(
        "활동 기록 종료"
    );

}


/* =========================================
   활동 종료 시 평균 속도
========================================= */

function updateFinalSpeed() {

    if (
        !startTime
    ) {

        return;
    }


    const now =
        new Date();


    const totalSeconds =
        Math.floor(
            (now - startTime)
            / 1000
        );


    const hours =
        totalSeconds / 3600;


    let averageSpeed =
        0;


    if (
        hours > 0
    ) {

        averageSpeed =
            totalDistance
            / hours;

    }


    document.getElementById(
        "speed"
    ).innerText =
        averageSpeed
        .toFixed(1)
        + " km/h";

}


/* =========================================
   GPS 에러
========================================= */

function errorPosition(
    error
) {

    console.log(
        error
    );


    switch(
        error.code
    ) {

        case error.PERMISSION_DENIED:

            alert(
                "위치 권한이 거부되었습니다."
            );

            break;


        case error.POSITION_UNAVAILABLE:

            alert(
                "위치 정보를 사용할 수 없습니다."
            );

            break;


        case error.TIMEOUT:

            alert(
                "위치 요청 시간이 초과되었습니다."
            );

            break;


        default:

            alert(
                "GPS 오류"
            );

    }

}


/* =========================================
   두 GPS 좌표 사이 거리 계산

   Haversine 공식
========================================= */

function calculateDistance(
    lat1,
    lon1,
    lat2,
    lon2
) {

    const R =
        6371;


    const dLat =
        (
            lat2 - lat1
        )
        * Math.PI
        / 180;


    const dLon =
        (
            lon2 - lon1
        )
        * Math.PI
        / 180;


    const a =

        Math.sin(
            dLat / 2
        )
        *
        Math.sin(
            dLat / 2
        )

        +

        Math.cos(
            lat1
            * Math.PI
            / 180
        )

        *

        Math.cos(
            lat2
            * Math.PI
            / 180
        )

        *

        Math.sin(
            dLon / 2
        )

        *

        Math.sin(
            dLon / 2
        );


    const c =

        2
        *
        Math.atan2(

            Math.sqrt(a),

            Math.sqrt(
                1 - a
            )

        );


    return R * c;

}


/* =========================================
   GPS 테스트
========================================= */

function testGPS() {

    if (
        !navigator.geolocation
    ) {

        alert(
            "GPS를 지원하지 않는 브라우저입니다."
        );

        return;
    }


    navigator.geolocation
        .getCurrentPosition(

            function(
                position
            ) {

                const lat =
                    position
                    .coords
                    .latitude;


                const lng =
                    position
                    .coords
                    .longitude;


                const accuracy =
                    position
                    .coords
                    .accuracy;


                map.setView(
                    [lat, lng],
                    18
                );


                alert(
                    "GPS 성공"
                    + "\n위도: "
                    + lat
                    + "\n경도: "
                    + lng
                    + "\n정확도: 약 "
                    + Math.round(
                        accuracy
                    )
                    + "m"
                );

            },


            function(
                error
            ) {

                console.log(
                    error
                );


                alert(
                    "GPS 에러 코드: "
                    + error.code
                );

            },


            {
                enableHighAccuracy:
                    true,

                timeout:
                    15000,

                maximumAge:
                    0
            }

        );

}


/* =========================================
   페이지 로드
========================================= */

document.addEventListener(
    "DOMContentLoaded",
    function() {

        initMap();

    }
);

function saveActivity() {

    if (positions.length === 0) {

        alert(
            "저장할 GPS 기록이 없습니다."
        );

        return;
    }


    if (!startTime) {

        alert(
            "활동 기록 정보가 없습니다."
        );

        return;
    }


    const hours =
        finalDurationSeconds
        / 3600;


    let averageSpeed = 0;


    if (hours > 0) {

        averageSpeed =
            totalDistance
            / hours;

    }

    const dogId =
        document.getElementById(
            "dog-select"
        ).value;


    const data = {

        // 현재는 테스트용 보리 ID
        dog_id: dogId,

        distance_km:
            Number(
                totalDistance.toFixed(3)
            ),

        duration_seconds:
            finalDurationSeconds,

        average_speed:
            Number(
                averageSpeed.toFixed(2)
            ),

        positions:
            positions

    };


    fetch(
        "/activity/save",
        {
            method: "POST",

            headers: {
                "Content-Type":
                    "application/json"
            },

            body:
                JSON.stringify(data)
        }
    )

    .then(
        response =>
            response.json()
    )

    .then(
        data => {

            if (data.success) {

                alert(
                    "활동 기록이 저장되었습니다!"
                );

                window.location.href =
                    "/activity/history";

            } else {

                alert(
                    data.message
                    || "저장에 실패했습니다."
                );

            }
        }
    )

    .catch(
        error => {

            console.error(error);

            alert(
                "활동 기록 저장 중 오류가 발생했습니다."
            );

        }
    );
}
// 버튼 개수는 줄이되 기존 startTracking / stopTracking 상태 전환을 재사용합니다.
function toggleTracking() {
    if (isTracking) {
        stopTracking();
    } else {
        startTracking();
    }
    syncTrackButton();
}
function syncTrackButton() {
    const button = document.getElementById('mainTrackBtn');
    button.textContent = isTracking ? '■ 활동 기록 종료' : '● 활동 기록 시작';
    button.classList.toggle('recording', isTracking);
}

</script>
