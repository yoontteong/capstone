<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>활동 기록</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            padding: 20px;
        }

        .box {
            background: white;
            border-radius: 20px;
            padding: 20px;
        }

        h2 {
            margin-bottom: 20px;
        }

        .info {
            font-size: 18px;
            line-height: 2;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            margin-top: 10px;
            background: #4caf50;
            color: white;
            font-size: 16px;
            font-weight: bold;
        }

        #status {
            margin-top: 15px;
            font-size: 18px;
            font-weight: bold;
        }

        button:disabled {
            background: #cccccc;
        }

        #secure-check {
            display: none;
        }

    </style>
</head>

<body>

<p id="secure-check"></p>

<div class="box">

    <h2>🐶 반려견 활동 기록</h2>

    <div class="info">
        <div>이동 거리: <span id="distance">0</span> km</div>
        <div>활동 시간: <span id="time">0분 0초</span></div>
    </div>

    <div id="status">
    기록 대기 중
    </div>

    <button id="startBtn" onclick="startTracking()">
        기록 시작
    </button>

    <button id="stopBtn" onclick="stopTracking()" disabled>
        기록 종료
    </button>

    <button onclick="testGPS()">
    GPS 테스트
</button>

</div>

<script>

document.getElementById("secure-check").innerText =
    "보안 환경 여부: " + window.isSecureContext;


let timerInterval = null;
let watchId = null;
let isTracking = false;
let positions = [];
let totalDistance = 0;
let startTime = null;

function startTracking() {

    if (!navigator.geolocation) {

        alert("GPS를 지원하지 않는 브라우저입니다.");
        return;
    }

    if (isTracking) {
    return;
    }

    isTracking = true;

    document.getElementById("status")
        .innerText = "🟢 활동 기록 중...";

    document.getElementById("startBtn")
        .disabled = true;

    document.getElementById("stopBtn")
        .disabled = false;
    

    positions = [];
    totalDistance = 0;

    document.getElementById("distance").innerText = "0";
    document.getElementById("time").innerText = "0";

    startTime = new Date();

    timerInterval = setInterval(function() {

        if (!isTracking) {
            return;
        }

        const now = new Date();

        const totalSeconds =
            Math.floor((now - startTime) / 1000);

        const minutes =
        Math.floor(totalSeconds / 60);

        const seconds =
            totalSeconds % 60;

        document.getElementById("time")
            .innerText =
            minutes + "분 " + seconds + "초";

    }, 1000);

    watchId =
        navigator.geolocation.watchPosition(
            updatePosition,
            errorPosition,
            {
                enableHighAccuracy: true,
                maximumAge: 0,
                timeout: 10000
            }
        );

    alert("활동 기록 시작");
}

function updatePosition(position) {

    if (!isTracking) {
        return;
    }

    if (watchId === null) {
        return;
    }

    const accuracy = position.coords.accuracy;

    if (accuracy > 50) {
        return;
    }

    const lat = position.coords.latitude;
    const lng = position.coords.longitude;

    const current = {
        lat: lat,
        lng: lng
    };

    // 첫 위치 저장
    if (positions.length === 0) {

        positions.push(current);

    } else {

        const prev =
            positions[positions.length - 1];

        const distance = calculateDistance(
            prev.lat,
            prev.lng,
            current.lat,
            current.lng
        );

        // GPS 순간 튐 방지
        if (distance < 0.1) {

            totalDistance += distance;

            positions.push(current);

            document.getElementById("distance")
                .innerText = totalDistance.toFixed(2);
        }
    }

}

function stopTracking() {

    isTracking = false;
    
    if (watchId !== null) {

        navigator.geolocation.clearWatch(
            watchId
        );

        watchId = null;
    }

    clearInterval(timerInterval);
    timerInterval = null;

    document.getElementById("status")
        .innerText = "🔴 활동 기록 종료";

    document.getElementById("startBtn")
        .disabled = false;

    document.getElementById("stopBtn")
        .disabled = true;

    alert("활동 기록 종료");
}

function errorPosition(error) {

    console.log(error);

    switch(error.code) {

        case error.PERMISSION_DENIED:
            alert("위치 권한이 거부되었습니다.");
            break;

        case error.POSITION_UNAVAILABLE:
            alert("위치 정보를 사용할 수 없습니다.");
            break;

        case error.TIMEOUT:
            alert("위치 요청 시간이 초과되었습니다.");
            break;

        default:
            alert("GPS 오류");
    }
}

function calculateDistance(
    lat1,
    lon1,
    lat2,
    lon2
) {

    const R = 6371;

    const dLat =
        (lat2 - lat1) * Math.PI / 180;

    const dLon =
        (lon2 - lon1) * Math.PI / 180;

    const a =
        Math.sin(dLat / 2) *
        Math.sin(dLat / 2) +

        Math.cos(lat1 * Math.PI / 180) *
        Math.cos(lat2 * Math.PI / 180) *

        Math.sin(dLon / 2) *
        Math.sin(dLon / 2);

    const c =
        2 * Math.atan2(
            Math.sqrt(a),
            Math.sqrt(1 - a)
        );

    return R * c;
}


function testGPS() {

    navigator.geolocation.getCurrentPosition(

        function(position) {

            alert(
                "GPS 성공\n위도: " +
                position.coords.latitude +
                "\n경도: " +
                position.coords.longitude
            );
        },

        function(error) {

            alert(
                "GPS 에러 코드: " +
                error.code
            );

            console.log(error);
        }
    );
}

</script>

</body>
</html>
